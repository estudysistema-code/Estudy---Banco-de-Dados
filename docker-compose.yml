# Postgres local para desenvolvimento.  docker compose up -d  →  make migrate seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estudy
    ports: ["5432:5432"]
    volumes: [estudy-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estudy"]
      interval: 2s
      retries: 20
volumes:
  estudy-pg:
