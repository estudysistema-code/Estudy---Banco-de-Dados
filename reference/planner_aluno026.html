/* Viewer chega por contrato (UserRef) através do Bus. O domínio Workspace
   nunca lê o registro do Identity nem a variável `profile`. */
let viewer = {id:'anon', displayName:'Você', avatarUrl:null};
Bus.on('identity.session.started', p => { viewer = p.user; });
Bus.on('identity.profile.updated', p => {
  viewer = p.user;
  const rec = Identity.current();
  Users.upsert({id:p.user.id, displayName:p.user.displayName, avatarUrl:p.user.avatarUrl,
    course: rec.course || '', institution: rec.institution || ''});
});

/* ---- adaptador de sincronização (desligado; ponto único de integração) ---- */
const wsSync = {
  enabled: false,
  async push(){ if (!this.enabled) return; /* futuro: PATCH /workspaces/:id */ },
  async pull(){ if (!this.enabled) return; /* futuro: GET /workspaces + merge por updatedAt */ }
};
const nowISO = () => new Date().toISOString();
function wsTouch(w){ if (w){ w.updatedAt = nowISO(); w.dirty = true; } }

const WORKSPACE_NS = Store.namespace('workspace', {
  schemaVersion: 3,
  legacyKey: 'estudy_workspaces_v1',
  adopt: legacy => ({workspaces: Array.isArray(legacy && legacy.workspaces) ? legacy.workspaces : []}),
  migrations: {
    2: (d, ctx) => {                              // v1→v2: 'u_me' literal vira o userId real
      if (!ctx.userId) return d;
      return JSON.parse(JSON.stringify(d).split('"u_me"').join('"' + ctx.userId + '"'));
    },
    3: (d, ctx) => {
      /* v2→v3: Épico 2. `members[]` embutido em cada workspace deixa de existir.
         Vira User (perfil) + Membership (papel/responsabilidade) + Invite (código),
         cada um no seu próprio namespace. Roda uma única vez, só em instalações
         que ainda tinham o formato antigo — instalações novas nunca passam aqui. */
      if (!ctx.usersNs || !ctx.membershipsNs || !ctx.invitesNs) return d;
      (d.workspaces || []).forEach(w => {
        const legacyMembers = Array.isArray(w.members) ? w.members : [];
        legacyMembers.forEach(m => {
          if (!ctx.usersNs.data.byId[m.id]){
            ctx.usersNs.data.byId[m.id] = {id:m.id, displayName:m.name || 'Aluno', avatarUrl:m.photo || null,
              course:'', institution:'', createdAt:nowISO(), updatedAt:nowISO()};
          }
          const already = ctx.membershipsNs.data.items.some(x => x.workspaceId === w.id && x.userId === m.id);
          if (!already){
            const role = m.role === 'criador' ? 'owner' : 'member';
            ctx.membershipsNs.data.items.push({id:uid(), workspaceId:w.id, userId:m.id, role,
              responsibility:m.duty || '', joinedAt:nowISO(), status:'active', permissions:permissionsFor(role)});
          }
        });
        if (w.invite && !ctx.invitesNs.data.items.some(i => i.workspaceId === w.id)){
          ctx.invitesNs.data.items.push({id:uid(), workspaceId:w.id, code:w.invite, createdBy:w.createdBy || ctx.userId,
            createdAt:nowISO(), expiresAt:null, maxUses:null, currentUses:0, status:'active'});
        }
        w.ownerId = w.createdBy || (legacyMembers.find(m => m.role === 'criador') || {}).id || ctx.userId;
        w.description = w.desc ?? w.description ?? '';
        w.inviteCode = w.invite || w.inviteCode || genInviteCode();
        delete w.members; delete w.invite; delete w.desc; delete w.createdBy;
      });
      ctx.usersNs.touch(); ctx.membershipsNs.touch(); ctx.invitesNs.touch();
      return d;
    }
  }
});

/* ---- identidade visual (independe de User/Membership; é só apresentação) ---- */
const AVC = ['#2f6fed','#0f9d6e','#e0396b','#7c4dea','#d99400','#0aa5b5','#e2621c','#4b52d4'];
const avColor = id => AVC[[...String(id)].reduce((a,c) => a + c.charCodeAt(0), 0) % AVC.length];
const initials = nm => (nm || '?').trim().split(/\s+/).slice(0,2).map(x => x[0]).join('').toUpperCase();
/* indicador online: mock determinístico, nunca persistido — Épico 8 troca por presença real */
const isOnline = id => id === viewer.id || [...String(id)].reduce((a,c) => a + c.charCodeAt(0), 0) % 3 === 0;
function avatar(ref, cls){
  const nm = ref.id === viewer.id ? viewer.displayName : ref.displayName;
  return `<div class="av ${cls||''}" style="background-color:${avColor(ref.id)}${ref.avatarUrl?`;background-image:url(${ref.avatarUrl})`:''}"
    title="${esc(nm)}">${ref.avatarUrl ? '' : esc(initials(nm))}<span class="on${isOnline(ref.id)?' live':''}"></span></div>`;
}
const wsCur = () => (wsStore.workspaces || []).find(w => w.id === wsSel);
/* join Membership + User — é assim que o resto do módulo "vê" um participante */
const participantsOf = w => Memberships.forWorkspace(w.id).map(m => ({membership:m, user:Users.ref(m.userId)}));
const membershipOf = (w, uid_) => Memberships.of(w.id, uid_);
const displayNameOf = uid_ => Users.ref(uid_).displayName;
const canOn = (w, perm) => { const m = membershipOf(w, viewer.id); return !!(m && m.permissions[perm]); };

const TSTATUS = {aberta:{l:'Aberta', c:'var(--ink-3)'}, andamento:{l:'Em andamento', c:'var(--medway)'}, concluida:{l:'Concluída', c:'var(--campo)'}};

const WSICONS = ['◍','◆','●','▲','■','✦','⬢','◈'];
const relDate = ds => { const n = Math.round((d(ds) - d(TODAY))/86400000);
  return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n === -1 ? 'ontem' : n > 0 ? 'em ' + n + ' dias' : Math.abs(n) + ' dias atrás'; };
const fmtWhen = t => { const x = new Date(t); return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'); };

/* ---- persistência: mesma infraestrutura do Kernel, namespace próprio ---- */
function wsSave(){ WORKSPACE_NS.touch(); wsSync.push(); }
async function wsLoad(){

    userId: viewer.id, usersNs: Store.ns('users'), membershipsNs: Store.ns('memberships'), invitesNs: Store.ns('invites')

}

/* ---------- calendário próprio do workspace ---------- */
function wsCalendar(w){
  const base = wsMonth || TODAY.slice(0,7);
  const [Y,M] = base.split('-').map(Number);
  const first = new Date(Y, M-1, 1), lead = (first.getDay()+6) % 7;
  const cells = [];
  for (let i = 0; i < 42; i++){
    const dt = new Date(Y, M-1, 1 - lead + i);
    cells.push({ds:iso(dt), off:dt.getMonth() !== M-1});
  }
  const evOn = ds => w.events.filter(e => e.date === ds).sort((a,b) => a.start.localeCompare(b.start));
  const mesEvs = w.events.filter(e => e.date.startsWith(base)).sort((a,b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
  return `
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="row" style="align-items:center;gap:8px">
      <button class="btn sm" data-wsmonth="-1">←</button>
      <b style="font-family:'Space Grotesk';font-size:17px">${MONTHS[M-1]} ${Y}</b>
      <button class="btn sm" data-wsmonth="1">→</button>
      <button class="btn sm" data-wsmonth="0">Hoje</button>
    </div>
    ${canOn(w,'manageEvents') ? `<button class="btn primary" data-wsevnew="${iso(new Date(Y,M-1,Math.min(new Date().getDate(),28)))}">+ Novo evento</button>` : ''}
  </div>
  <div class="card pad" style="margin-bottom:18px">
    <div class="cal">
      ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x => `<div class="wd">${x}</div>`).join('')}
      ${cells.map(c => {
        const evs = evOn(c.ds);
        return `<div class="cell${c.off?' off':''}${c.ds===TODAY?' now':''}" data-wsday="${c.ds}">
          <div class="dn">${d(c.ds).getDate()}</div>
          ${evs.slice(0,2).map(e => `<div class="cev" style="--c:${w.color};--bg:var(--sel)">${e.start} ${esc(e.title)}</div>`).join('')}
          ${evs.length > 2 ? `<div class="small muted" style="font-size:9.5px;margin-top:2px">+${evs.length-2}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="sec-title" style="margin-top:0">Eventos de ${MONTHS[M-1].toLowerCase()}</div>
  <div class="card pad">${mesEvs.length ? mesEvs.map(e => `<div class="ev" style="--c:${w.color};--bg:var(--sel)" data-wsev="${e.id}">
      <div class="t"><div class="time mono">${DOW[dow(e.date)]} ${fmtBR(e.date)} · ${e.start}–${e.end}</div>
      <div class="title">${esc(e.title)}</div>
      <div class="meta">${esc(displayNameOf(e.createdBy))}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
    </div>`).join('') : '<div class="small muted">Nenhum evento neste mês.</div>'}</div>
  <div class="small muted" style="margin-top:10px">Este calendário é do grupo e não entra no seu planner pessoal nem no cálculo de presença.</div>`;
}

/* ---------- tarefas ---------- */

  const atras = t.due && t.due < TODAY && t.status !== 'concluida';
  return `<div class="ev" style="--c:${TSTATUS[t.status].c};--bg:var(--sel)" data-wstask="${t.id}">
    <div class="t"><div class="time mono">${TSTATUS[t.status].l}${t.due ? ' · ' + fmtBR(t.due) : ''}${atras ? ' · atrasada' : ''}</div>
    <div class="title">${esc(t.title)}</div>
    <div class="meta">${t.assignee ? esc(displayNameOf(t.assignee)) : 'sem responsável'}${t.comments.length ? ' · ' + t.comments.length + ' comentário' + (t.comments.length===1?'':'s') : ''}</div></div>
  </div>`;
}
function wsTasks(w){
  const col = st => w.tasks.filter(t => t.status === st);
  const canManage = canOn(w,'manageTasks');
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div class="small muted">${canManage ? 'Arraste não: toque na tarefa para mudar status, responsável ou prazo.' : 'Você tem acesso de leitura nesta área.'}</div>
    ${canManage ? `<button class="btn primary" data-wstasknew="1">+ Nova tarefa</button>` : ''}
  </div>
  <div class="kan">
    ${['aberta','andamento','concluida'].map(st => `<div class="kcol">
      <h5>${TSTATUS[st].l}<span>${col(st).length}</span></h5>
      ${col(st).map(t => {
        const atras = t.due && t.due < TODAY && st !== 'concluida';
        const ref = t.assignee ? Users.ref(t.assignee) : null;
        return `<div class="tcard" style="--c:${TSTATUS[st].c}" data-wstask="${t.id}">
          <div class="tt">${esc(t.title)}</div>
          ${t.desc ? `<div class="small muted" style="margin-top:3px">${esc(t.desc.slice(0,90))}</div>` : ''}
          <div class="mt">
            <span>${ref ? avatar(ref,'sm') : '<span class="small muted">sem responsável</span>'}</span>
            <span style="color:${atras?'var(--prova)':'var(--ink-3)'}">${t.due ? fmtBR(t.due) : '—'}${t.comments.length ? ' · ' + t.comments.length + ' com.' : ''}</span>
          </div>
        </div>`;
      }).join('') || '<div class="small muted">Vazio</div>'}

/* ---------- comentários ---------- */
function wsCommentHTML(w, c, compact){
  const replies = w.comments.filter(x => x.parentId === c.id);
  const u = Users.ref(c.author);
  return `<div class="cmt">
    ${avatar(u)}
    <div class="bd">
      <div class="hd"><b>${esc(c.author === viewer.id ? viewer.displayName : u.displayName)}</b><span class="small muted">${fmtWhen(c.at)}</span></div>
      <div class="tx">${esc(c.text)}</div>
      ${compact ? '' : `<button class="btn sm" data-wsreply="${c.id}" style="margin-top:7px">Responder</button>`}

        return `<div class="rp" style="margin-top:10px"><div class="hd">

          <div class="tx">${esc(r.text)}</div></div>`;

function wsComments(w){
  const roots = w.comments.filter(c => !c.parentId);
  return `
  <div class="card pad" style="margin-bottom:16px">
    <div class="field" style="margin-bottom:8px"><textarea id="wscmt" placeholder="Escreva um comentário para o grupo…"

    <button class="btn primary" id="wscmtsend">Comentar</button>

/* ============================ AÇÕES ============================ */
function openSheet(title, body, wire){          // modal genérico, reutiliza #modalWrap
  document.getElementById('modal').innerHTML = `<h3>${title}</h3>${body}`;
  document.getElementById('modalWrap').classList.remove('hidden');
  if (wire) wire();
}
const gv = id => (document.getElementById(id) || {}).value;

function wsRerender(){ wsSave(); render(); }

function wsOpenWorkspaceForm(w){
  openSheet(w ? 'Editar workspace' : 'Novo workspace', `
    <div class="field"><label>Nome</label><input id="w_name" value="${esc(w?w.name:'')}" placeholder="Ex.: Grupo de Estudos — Clínica Médica"></div>
    <div class="field"><label>Descrição</label><input id="w_desc" value="${esc(w?w.description:'')}" placeholder="Para que serve este espaço"></div>
    <div class="field"><label>Cor</label><div class="chips" id="w_colors">
      ${WSCOLORS.map((c,i) => `<button class="chip" data-pickcolor="${i}" style="background:${c};border-color:${c};width:32px;height:28px"></button>`).join('')}</div></div>
    <div class="field"><label>Ícone</label><div class="chips" id="w_icons">
      ${WSICONS.map((ic,i) => `<button class="chip" data-pickicon="${i}" style="font-size:15px">${ic}</button>`).join('')}</div></div>
    <div class="onb-err" id="w_err"></div>
    <div class="row" style="justify-content:space-between">
      <div>${w && membershipOf(w, viewer.id)?.permissions.deleteWorkspace ? '<button class="btn danger" id="w_del">Excluir workspace</button>' : ''}</div>
      <div class="row"><button class="btn" id="w_cancel">Cancelar</button><button class="btn primary" id="w_save">Salvar</button></div>
    </div>`, () => {
    let color = w ? w.color : WSCOLORS[0], icon = w ? w.icon : WSICONS[0];
    const mark = () => {
      document.querySelectorAll('[data-pickcolor]').forEach(b => b.style.outline = WSCOLORS[+b.dataset.pickcolor] === color ? '2px solid var(--ink)' : 'none');
      document.querySelectorAll('[data-pickicon]').forEach(b => b.classList.toggle('on', WSICONS[+b.dataset.pickicon] === icon));
    };
    document.querySelectorAll('[data-pickcolor]').forEach(b => b.onclick = () => { color = WSCOLORS[+b.dataset.pickcolor]; mark(); });
    document.querySelectorAll('[data-pickicon]').forEach(b => b.onclick = () => { icon = WSICONS[+b.dataset.pickicon]; mark(); });
    mark();
    document.getElementById('w_cancel').onclick = closeModal;
    const delBtn = document.getElementById('w_del');
    if (delBtn) delBtn.onclick = () => {
      if (!confirm('Excluir “' + w.name + '” e tudo que está dentro dele?')) return;
      wsStore.workspaces = wsStore.workspaces.filter(x => x.id !== w.id);
      wsSel = null; view = 'workspaces'; closeModal(); wsRerender(); toast('Workspace excluído');
      Bus.emit('workspace.deleted', {workspaceId:w.id});
    };
    document.getElementById('w_save').onclick = () => {
      const name = gv('w_name').trim();
      if (!name){ document.getElementById('w_err').textContent = 'Dê um nome ao workspace.'; return; }
      if (w){ Object.assign(w, {name, description:gv('w_desc').trim(), color, icon}); wsTouch(w); Bus.emit('workspace.updated', {workspaceId:w.id}); }
      else {
        const nw = {id:uid(), name, description:gv('w_desc').trim(), color, icon, ownerId:viewer.id, inviteCode:genInviteCode(),
          createdAt:nowISO(), updatedAt:nowISO(), dirty:true, events:[], tasks:[], files:[], comments:[]};
        wsStore.workspaces.push(nw);
        Memberships.add({workspaceId:nw.id, userId:viewer.id, role:'owner', responsibility:''});
        Invites.create({workspaceId:nw.id, createdBy:viewer.id, code:nw.inviteCode});
        wsSel = nw.id; wsTab = 'overview'; view = 'ws';
        Bus.emit('workspace.created', {workspaceId:nw.id, name:nw.name});
      }
      closeModal(); wsRerender(); toast(w ? 'Workspace atualizado' : 'Workspace criado');
    };
  });
}

function wsOpenJoin(){
  openSheet('Entrar com código', `
    <div class="field"><label>Código de convite</label><input id="j_code" placeholder="ESTUDY-XXXX" style="text-transform:uppercase"></div>
    <div class="onb-err" id="j_err"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="j_cancel">Cancelar</button><button class="btn primary" id="j_go">Entrar</button></div>
    <div class="small muted" style="margin-top:12px">Sem servidor, o código só encontra workspaces deste aparelho. A validação remota entra junto com a sincronização.</div>`, () => {
    document.getElementById('j_cancel').onclick = closeModal;
    document.getElementById('j_go').onclick = () => {
      const code = (gv('j_code')||'').trim().toUpperCase();
      const check = Invites.validate(code);
      const REASON = {not_found:'Código não encontrado neste aparelho.', inactive:'Este convite não está mais ativo.',
        expired:'Este convite expirou.', exhausted:'Este convite atingiu o limite de participantes.'};
      if (!check.ok){ document.getElementById('j_err').textContent = REASON[check.reason] || 'Não foi possível entrar com este código.'; return; }
      const w = wsStore.workspaces.find(x => x.id === check.invite.workspaceId);
      if (!w){ document.getElementById('j_err').textContent = 'Workspace deste convite não foi encontrado.'; return; }
      if (Memberships.isMember(w.id, viewer.id)){
        wsSel = w.id; wsTab = 'overview'; view = 'ws'; closeModal(); render();
        toast('Você já participa de ' + w.name); return;
      }
      Invites.redeem(code);
      Memberships.add({workspaceId:w.id, userId:viewer.id, role:'member', responsibility:''});
      wsSel = w.id; wsTab = 'overview'; view = 'ws'; closeModal(); render();
      toast('Você entrou em ' + w.name);
    };
  });
}

      w.tasks = w.tasks.filter(y => y.id !== t.id); wsTouch(w); closeModal(); wsRerender();
      Bus.emit('workspace.task.deleted', {workspaceId:w.id, taskId:t.id});
      toast('Tarefa excluída');
    };
    document.getElementById('t_save').onclick = () => {
      const o = {title:gv('t_title').trim() || 'Sem título', desc:gv('t_desc').trim(), assignee:gv('t_ass') || null, due:gv('t_due') || null, status:gv('t_st')};
      if (t){ Object.assign(t, o); Bus.emit('workspace.task.updated', {workspaceId:w.id, taskId:t.id}); }
      else { const nt = {id:uid(), ...o, comments:[], createdBy:viewer.id, createdAt:nowISO()}; w.tasks.push(nt);
        Bus.emit('workspace.task.created', {workspaceId:w.id, taskId:nt.id, assignee:nt.assignee}); }
      wsTouch(w); closeModal(); wsRerender(); toast(t ? 'Tarefa atualizada' : 'Tarefa criada');
    };
  });
}

function wsOpenMemberForm(w, membership){
  const isSelf = membership && membership.userId === viewer.id;
  const u = membership ? Users.ref(membership.userId) : null;
  const canManage = canOn(w,'manageMembers');
  openSheet(membership ? 'Participante' : 'Adicionar participante', `
    ${membership ? `<div class="field"><label>Nome</label><input id="m_name" value="${esc(isSelf?viewer.displayName:u.displayName)}" ${isSelf||!canManage?'disabled':''}></div>`
      : `<div class="field"><label>Nome</label><input id="m_name" placeholder="Nome do participante"></div>`}
    <div class="field"><label>Responsabilidade</label><input id="m_duty" value="${esc(membership?membership.responsibility:'')}" placeholder="Ex.: Resumos de cardiologia" ${!canManage && !isSelf ? 'disabled' : ''}></div>
    ${membership && membership.role !== 'owner' && canManage ? `<div class="field"><label>Papel</label><select id="m_role">
        ${ROLES.filter(r=>r!=='owner').map(r => `<option value="${r}"${r===membership.role?' selected':''}>${ROLE_LABEL[r]}</option>`).join('')}
      </select></div>` : membership ? `<div class="field"><label>Papel</label><input value="${ROLE_LABEL[membership.role]}" disabled></div>` : ''}
    ${!membership ? `<div class="field"><label>Foto (opcional)</label><input id="m_photo" type="file" accept=".jpg,.jpeg,.png"></div>` : ''}
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <div>${membership && !isSelf && membership.role !== 'owner' && canManage ? '<button class="btn danger" id="m_del">Remover do grupo</button>' : ''}</div>
      <div class="row"><button class="btn" id="m_cancel">Cancelar</button><button class="btn primary" id="m_save">Salvar</button></div>
    </div>
    ${membership && membership.role === 'owner' ? '<div class="small muted" style="margin-top:10px">O proprietário não pode ser removido nem rebaixado por aqui.</div>' : ''}`, () => {
    let photo = null;
    const photoInput = document.getElementById('m_photo');
    if (photoInput) photoInput.onchange = async e2 => {
      const f = e2.target.files[0]; if (!f) return;
      photo = 'data:' + f.type + ';base64,' + await b64(f);
      toast('Foto carregada');
    };
    document.getElementById('m_cancel').onclick = closeModal;
    const del = document.getElementById('m_del');
    if (del) del.onclick = () => {
      Memberships.remove(membership.id); wsRerender(); closeModal(); toast('Participante removido');
    };
    document.getElementById('m_save').onclick = () => {
      const duty = gv('m_duty').trim();
      if (membership){
        Memberships.setResponsibility(membership.id, duty);
        const roleSel = document.getElementById('m_role');
        if (roleSel && roleSel.value !== membership.role) Memberships.setRole(membership.id, roleSel.value);
        if (isSelf) Users.upsert({id:viewer.id, displayName: gv('m_name').trim() || viewer.displayName});
        else if (canManage) Users.upsert({id:membership.userId, displayName: gv('m_name').trim() || u.displayName});
      } else {
        const nm = gv('m_name').trim();
        if (!nm){ toast('Digite o nome'); return; }
        const newUser = Users.upsert({id:uid(), displayName:nm, avatarUrl:photo, course:'', institution:''});
        Memberships.add({workspaceId:w.id, userId:newUser.id, role:'member', responsibility:duty});
      }
      closeModal(); wsRerender(); toast(membership ? 'Participante atualizado' : 'Participante adicionado');
    };
  });
}

function wsAddFiles(w, list){
  if (!canOn(w,'manageAssets')){ toast('Você não tem permissão para enviar arquivos aqui.'); return; }
  let skip = 0;
  for (const f of list){
    const x = extOf(f.name);
    if (!OKEXT[x]){ skip++; continue; }
    const as = {id:uid(), name:f.name, size:f.size, ext:x, addedBy:viewer.id, addedAt:nowISO(), aiStatus:'pendente', stored:false};
    w.files.push(as);
    Bus.emit('workspace.asset.uploaded', {workspaceId:w.id, assetId:as.id, ext:x, size:f.size});
  }
  wsTouch(w); wsRerender();
  toast(skip ? 'Alguns arquivos foram ignorados (só PDF, DOCX, JPEG e PNG)' : 'Arquivos anexados ao workspace');
}

/* ---- ligação pós-render (drop zone e caixa de comentário) ---- */
function wsAfterRender(){
  const w = wsCur(); if (!w) return;
  const drop = document.getElementById('wsdrop'), inp = document.getElementById('wsfiles');
  if (drop){
    drop.onclick = () => inp.click();
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); wsAddFiles(w, e.dataTransfer.files); };
    inp.onchange = () => wsAddFiles(w, inp.files);
  }
  const send = document.getElementById('wscmtsend');
  if (send) send.onclick = () => {
    const box = document.getElementById('wscmt'), v = box.value.trim();
    if (!v) return;
    const a = {id:uid(), author:viewer.id, text:v, at:nowISO(), parentId:null};
    w.comments.push(a);
    wsTouch(w); wsRerender();
    Bus.emit('workspace.activity.created', {workspaceId:w.id, activityId:a.id, type:'comment', parentId:null});
  };
}

/* Persistência de Identity vive no Kernel (Store ns 'identity'). */
const COURSES = ['Medicina','Enfermagem','Odontologia','Farmácia','Fisioterapia','Nutrição','Psicologia','Biomedicina','Medicina Veterinária','Educação Física','Direito','Engenharia','Arquitetura','Administração','Contabilidade','Computação / TI','Outro'];
const PERIODS = ['1º','2º','3º','4º','5º','6º','7º','8º','9º','10º','11º','12º','Internato'];
let profile = null;
let onb = {step:'auth', mode:'signup', files:[], busy:false, err:'', hint:'ALUNO_026', tmp:{}};

const loadProfile = () => Identity.current();
const saveProfile = () => Identity.commit();
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
const fsize = n => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB';
const extOf = nm => nm.toLowerCase().split('.').pop();
const OKEXT = {pdf:'#e0396b', docx:'#2f6fed', jpg:'#0f9d6e', jpeg:'#0f9d6e', png:'#7c4dea'};
const b64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
const STEPS = ['auth','name','course','period','files'];
const dots = () => '<div class="onb-dots">' + STEPS.map((x,j) => '<i class="'+(j <= STEPS.indexOf(onb.step) ? 'on':'')+'"></i>').join('') + '</div>';
const errBox = () => '<div class="onb-err">' + esc(onb.err) + '</div>';

      ${onb.tmp.course === 'Outro' ? `<div class="field" style="margin-top:10px"><input id="o_course_other" placeholder="Escreva o nome do curso" value="${esc(onb.tmp.courseOther||'')}"></div>
        <button class="btn primary" id="o_go" style="width:100%;padding:11px">Continuar</button>` : ''}
      ${errBox()}

    <div class="field" style="margin-top:12px"><label>Filtrar por aluno / turma (opcional)</label>
      <input id="o_hint" value="${esc(onb.hint)}" placeholder='ex.: "ALUNO_026"'></div>
    ${errBox()}
    <button class="btn primary" id="o_build" style="width:100%;padding:11px" ${onb.busy||!onb.files.length ? 'disabled style="width:100%;padding:11px;opacity:.55"' : ''}>

function renderOnb(){
  document.getElementById('onb').innerHTML = onbView();
  const g = id => document.getElementById(id);
  const err = m => { onb.err = m; renderOnb(); };

  document.querySelectorAll('[data-oauth]').forEach(b => b.onclick = async () => {
    const prov = b.dataset.oauth;
    onb.tmp = {...onb.tmp, provider:prov, user:onb.tmp.user || (prov==='apple'?'usuario.apple':'usuario.google'), email:onb.tmp.email || ''};
    onb.err = ''; onb.step = 'name'; renderOnb();
  });
  const back = g('o_back');
  if (back) back.onclick = () => finishBoot();

  const sw = g('o_switch');
  if (sw) sw.onclick = () => { onb.mode = onb.mode==='signup' ? 'signin' : 'signup'; onb.err=''; renderOnb(); };

  const go = g('o_go');
  if (go && onb.step === 'auth') go.onclick = async () => {
    const email = g('o_email').value.trim(), pass = g('o_pass').value;
    if (onb.mode === 'signup'){
      const user = g('o_user').value.trim();
      onb.tmp.user = user; onb.tmp.email = email;
      if (user.length < 3) return err('Escolha um nome de usuário com pelo menos 3 caracteres.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err('Digite um e-mail válido.');
      if (pass.length < 6) return err('A senha precisa de pelo menos 6 caracteres.');
      onb.tmp.passHash = await sha256(pass); onb.tmp.provider = 'email';
      onb.err = ''; onb.step = 'name'; renderOnb();
    } else {
      if (!profile) return err('Nenhuma conta encontrada neste aparelho. Crie uma conta primeiro.');
      if (profile.provider !== 'email') return err('Esta conta entra com ' + (profile.provider==='apple'?'Apple':'Google') + ' — use o botão acima.');
      if (email.toLowerCase() !== (profile.email||'').toLowerCase()) return err('E-mail não confere com a conta deste aparelho.');
      if (await sha256(pass) !== profile.passHash) return err('Senha incorreta.');
      Identity.merge({signedIn:true});
      profile.onboarded ? finishBoot() : (onb.step = 'name', renderOnb());
    }
  };

  const nm = g('o_name');
  if (nm){
    const adv = () => {
      onb.tmp.name = nm.value.trim();
      if (!onb.tmp.name) return err('Digite seu nome para continuar.');
      onb.err = ''; onb.step = 'course'; renderOnb();
    };
    g('o_go').onclick = adv;
    nm.onkeydown = e => { if (e.key === 'Enter') adv(); };
    nm.focus();
  }

  document.querySelectorAll('[data-course]').forEach(b => b.onclick = () => {
    onb.tmp.course = b.dataset.course; onb.err = '';
    if (onb.tmp.course === 'Outro') renderOnb();
    else { onb.step = 'period'; renderOnb(); }
  });
  const co = g('o_course_other');
  if (co && g('o_go')) g('o_go').onclick = () => {
    const v = co.value.trim();
    if (!v) return err('Escreva o nome do curso.');
    onb.tmp.course = v; onb.err = ''; onb.step = 'period'; renderOnb();
  };

  document.querySelectorAll('[data-period]').forEach(b => b.onclick = () => {
    onb.tmp.period = b.dataset.period; onb.err = ''; onb.step = 'files'; renderOnb();
  });

  const drop = g('drop'), inp = g('o_files');
  if (drop){
    drop.onclick = () => inp.click();
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
    inp.onchange = () => addFiles(inp.files);
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { onb.files.splice(+b.dataset.rm,1); renderOnb(); });
    const hint = g('o_hint'); if (hint) hint.onchange = () => { onb.hint = hint.value.trim(); };
    g('o_skip').onclick = async () => { onb.hint = g('o_hint').value.trim(); await completeOnboarding(false); };
    g('o_build').onclick = async () => {
      if (!onb.files.length || onb.busy) return;
      onb.hint = g('o_hint').value.trim(); onb.busy = true; onb.err = ''; renderOnb();
      try {
        const rows = await extractFromFiles(onb.files, onb.hint);
        if (!rows) throw new Error('vazio');
        applyImportedPlan(rows);
        Bus.emit('planner.plan.imported', {events:rows.length});
        Bus.emit('ai.job.completed', {kind:'extract', items:rows.length});
        await completeOnboarding(true, rows.length);
      } catch(e){
        onb.busy = false;
        err('Não consegui montar o planner a partir destes arquivos (a análise precisa de conexão e de arquivos legíveis). Tente outros arquivos ou use a agenda de exemplo abaixo.');
      }
    };
  }
}

function addFiles(list){
  const cur = onb.files.reduce((a,f) => a+f.size, 0);
  let add = 0, skip = 0;
  for (const f of list){
    if (!OKEXT[extOf(f.name)]){ skip++; continue; }
    if (cur + add + f.size > 22*1048576){ skip++; continue; }
    onb.files.push(f); add += f.size;
  }
  onb.err = skip ? 'Alguns arquivos foram ignorados: só aceito PDF, DOCX, JPEG e PNG até 22 MB no total.' : '';
  renderOnb();
}

async function docxText(f){
  if (!window.mammoth) await new Promise((res,rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
  const r = await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()});
  return r.value || '';
}

async function extractFromFiles(files, hint){
  const content = [];
  for (const f of files){
    const x = extOf(f.name);
    if (x === 'pdf') content.push({type:'document', source:{type:'base64', media_type:'application/pdf', data: await b64(f)}});
    else if (x === 'png' || x === 'jpg' || x === 'jpeg')
      content.push({type:'image', source:{type:'base64', media_type: x==='png' ? 'image/png' : 'image/jpeg', data: await b64(f)}});
    else if (x === 'docx') content.push({type:'text', text:'Arquivo '+f.name+':\n'+(await docxText(f)).slice(0,14000)});
  }
  content.push({type:'text', text:
    'Extraia TODOS os eventos de agenda acadêmica destes arquivos (data, horário de início e fim, tipo, nome).'
    + (hint ? ' Considere APENAS as linhas do aluno/turma "'+hint+'".' : '')
    + ' Responda SOMENTE com JSON válido, sem markdown e sem texto extra, no formato'
    + ' {"events":[["AAAA-MM-DD","HH:MM","HH:MM","TIPO","Título curto"],...]}.'
    + ' TIPO deve ser um de: CAMPO, TEORIA, PROVA, SIMULACAO, MEDWAY, ACOLHIMENTO (use CAMPO na dúvida).'
    + ' Máxima compactação, sem espaços desnecessários.'});
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content}]})
  });
  const data = await resp.json();
  const text = (data.content||[]).map(i => i.type === 'text' ? i.text : '').join('\n');
  return parseRows(text);
}

function parseRows(text){
  let t = (text||'').replace(/```json|```/g,'').trim();
  const tryP = x => { try { const o = JSON.parse(x); return Array.isArray(o.events) ? o.events : null; } catch(e){ return null; } };
  let rows = tryP(t);
  if (!rows){ const i = t.lastIndexOf('],'); if (i > 0) rows = tryP(t.slice(0, i+1) + ']}'); }
  if (!rows) return null;
  const dre = /^\d{4}-\d{2}-\d{2}$/, tre = /^\d{2}:\d{2}$/;
  rows = rows.filter(r => Array.isArray(r) && r.length >= 5 && dre.test(r[0]) && tre.test(r[1]) && tre.test(r[2]) && r[4])
    .map(r => [r[0], r[1], r[2], TYPES[r[3]] ? r[3] : 'CAMPO', String(r[4]).slice(0,90)]);
  return rows.length ? rows : null;
}

function applyImportedPlan(rows){
  rows.sort((a,b) => a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]));
  const st = d(rows[0][0]); st.setDate(st.getDate() - ((st.getDay()+6) % 7));
  const last = rows[rows.length-1][0];
  WEEKS.length = 0; _wk.clear();
  let cur = iso(st), i = 1;
  while (cur <= last && i <= 60){
    WEEKS.push({id:'S'+String(i).padStart(2,'0'), start:cur, end:addDays(cur,6), rod:'Plano importado', mod:'GERAL'});
    cur = addDays(cur,7); i++;
  }
  state.events = rows.map(r => ({id:uid(), date:r[0], start:r[1], end:r[2], type:r[3], title:r[4], note:'', status:'pendente', done:false, custom:false}));
  state.baseline = rows; state.weeks = WEEKS.map(w => ({...w})); state.notes = {};
  invalidate();
}

async function completeOnboarding(imported, n){
  const prev = Identity.current() || {};
  profile = Identity.merge({
    username: onb.tmp.user || prev.username || '', email: onb.tmp.email || prev.email || '',
    passHash: onb.tmp.passHash || prev.passHash || null,
    provider: onb.tmp.provider || prev.provider || 'email',
    name: onb.tmp.name || prev.name || '', course: onb.tmp.course || prev.course || '',
    period: onb.tmp.period || prev.period || '', onboarded: true, signedIn: true,
    files: onb.files.length ? onb.files.map(f => ({name:f.name, size:f.size})) : (prev.files || [])
  });
  await save(); flush();
  finishBoot();
  toast(imported ? n + ' atividades importadas dos seus arquivos' : 'Planner iniciado com a agenda de exemplo');
}

function fillProfileBox(){
  const b = document.getElementById('profileBox');
  if (b && profile){
    const per = profile.period === 'Internato' ? 'Internato' : (profile.period ? profile.period + ' período' : '');
    b.innerHTML = '<b>' + esc(profile.name || profile.username || 'Aluno') + '</b><br>'
      + '<span>' + esc(profile.course || '') + (per ? ' · ' + per : '') + '</span><br>'
      + '<button class="btn sm" id="logoutBtn" style="margin-top:8px">' + (SKIP_AUTH ? 'Ver telas de cadastro' : 'Sair da conta') + '</button>';
    document.getElementById('logoutBtn').onclick = async () => {
      if (SKIP_AUTH){ onb.mode = 'signup'; onb.step = 'auth'; onb.err = ''; showOnb(); return; }
      Identity.signOut();
      onb.mode = 'signin'; onb.step = 'auth'; onb.err = ''; showOnb();
    };
  }
  const bs = document.getElementById('brandSub');
  if (bs && profile && profile.course){
    const per = profile.period === 'Internato' ? 'Internato' : (profile.period ? profile.period + ' período' : '');
    bs.textContent = profile.course + (per ? ' · ' + per : '');
  }
}

function showOnb(){
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('onb').classList.remove('hidden');
  renderOnb();
}
function finishBoot(){
  if (state.weeks && state.weeks.length){
    WEEKS.length = 0; state.weeks.forEach(w => WEEKS.push({...w})); _wk.clear(); invalidate();
  }
  weekSel = currentWeekId(); ciDate = TODAY;
  document.getElementById('onb').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  fillProfileBox(); render();
}

      name: profile.name || 'Aluno_026', course: profile.course || 'Medicina',

    }, {persist:false});                       // visualização: não grava sessão falsa
  }

  await wsLoad();                               // só agora: viewer/UserRef já está correto

  if (SKIP_AUTH || (profile.onboarded && profile.signedIn)) finishBoot();

  Router.start(() => render());
  console.info('[Estudy] namespaces:', Store.list());
})();
