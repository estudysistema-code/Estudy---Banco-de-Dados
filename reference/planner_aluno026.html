<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner de Internato · 2026.2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcfcfb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#fcfcfb; --card:#ffffff; --ink:#1b1b1a; --ink-2:#5c5c58; --ink-3:#8d8d87;
  --line:#eceae6; --line-2:#e2dfd9; --sel:#f4f3f0;
  --teoria:#2f6fed;  --teoria-bg:#eef3ff;
  --campo:#0f9d6e;   --campo-bg:#eafaf3;
  --prova:#e0396b;   --prova-bg:#fdeef3;
  --medway:#d99400;  --medway-bg:#fff6e3;
  --simulacao:#7c4dea; --simulacao-bg:#f3eeff;
  --acolhimento:#0aa5b5; --acolhimento-bg:#e6f9fb;
  --academia:#e2621c; --academia-bg:#fff0e6;
  --estudo:#4b52d4;  --estudo-bg:#eeeffd;
  --pessoal:#6b7280; --pessoal-bg:#f3f4f6;
  --radius:12px;
  --shadow:0 1px 2px rgba(27,27,26,.05), 0 6px 20px -12px rgba(27,27,26,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk','Inter',sans-serif; letter-spacing:-.02em; margin:0}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:inherit; color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:236px; flex:0 0 236px; border-right:1px solid var(--line);
  background:#faf9f7; padding:20px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:6px 10px 16px}
.brand .eyebrow{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.brand .name{font-size:18px; font-weight:700; margin-top:4px; line-height:1.15}
.brand .sub{font-size:11.5px; color:var(--ink-3); margin-top:5px}
.navgroup{margin-top:14px}
.navlabel{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); padding:0 10px 6px; font-weight:600}
.navbtn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:0; background:none;
  padding:7px 10px; border-radius:8px; color:var(--ink-2); font-weight:500; margin-bottom:1px;
}
.navbtn:hover{background:var(--sel); color:var(--ink)}
.navbtn.active{background:#efeee9; color:var(--ink); font-weight:600}
.navbtn .ic{width:18px; text-align:center; font-size:14px}
.sidefoot{margin-top:18px; padding:12px 10px 0; border-top:1px solid var(--line); font-size:11px; color:var(--ink-3)}

main{flex:1; min-width:0; padding:34px 40px 90px; max-width:1180px}
.page-head{margin-bottom:22px}
.page-head .kicker{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.page-head h1{font-size:34px; font-weight:700; margin-top:6px}
.page-head p{color:var(--ink-2); margin:8px 0 0; max-width:70ch}

/* ---------- generic ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.grid{display:grid; gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.sec-title{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:26px 0 10px}
.btn{border:1px solid var(--line-2); background:#fff; padding:7px 12px; border-radius:8px; font-weight:500; color:var(--ink-2)}
.btn:hover{background:var(--sel); color:var(--ink)}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.danger{color:var(--prova); border-color:#f3d3de}
.btn.danger:hover{background:var(--prova-bg)}
.btn.sm{padding:4px 9px; font-size:12px; border-radius:7px}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-2)}
.field input,.field select,.field textarea{
  border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; background:#fff; outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink-3); box-shadow:0 0 0 3px #efeee9}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  border:1px solid var(--line-2); background:#fff; padding:5px 11px; border-radius:999px;
  font-size:12.5px; font-weight:500; color:var(--ink-2)
}
.chip:hover{background:var(--sel)}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fff}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block}
.tag{
  display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; padding:2px 7px; border-radius:5px
}
.empty{border:1px dashed var(--line-2); border-radius:var(--radius); padding:26px; text-align:center; color:var(--ink-3)}

/* ---------- stats ---------- */
.stat{padding:15px 16px}
.stat .n{font-family:'Space Grotesk'; font-size:27px; font-weight:700; line-height:1}
.stat .l{font-size:11.5px; color:var(--ink-3); margin-top:5px}
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:10px}
.bar > i{display:block; height:100%; background:var(--ink); border-radius:99px}

/* ---------- events ---------- */
.ev{
  display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:9px;
  border:1px solid var(--line); border-left:3px solid var(--c); background:var(--bg); margin-bottom:6px;
  cursor:pointer; transition:transform .08s ease
}
.ev:hover{transform:translateX(2px)}
.ev.is-marked{opacity:.62}
.ev .t{flex:1; min-width:0}
.ev .time{font-size:11px; font-weight:600; color:var(--c); letter-spacing:.01em}
.ev .title{font-weight:600; font-size:13.5px; margin-top:1px; overflow-wrap:anywhere}
.ev .meta{font-size:11px; color:var(--ink-3); margin-top:2px}
.chk{
  width:18px; height:18px; border-radius:6px; border:1.5px solid var(--line-2); background:#fff;
  flex:0 0 auto; margin-top:2px; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff
}
.chk.st-presente{background:var(--campo); border-color:var(--campo)}
.chk.st-falta{background:var(--prova); border-color:var(--prova)}
.chk.st-justificada{background:var(--medway); border-color:var(--medway)}

/* ---------- check-in ---------- */
.datenav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.datenav .nowbox{
  border:1px solid var(--line); background:var(--card); border-radius:11px; padding:9px 15px; box-shadow:var(--shadow)
}
.datenav .nowbox b{font-family:'Space Grotesk'; font-size:15px; display:block}
.datenav .nowbox span{font-size:11px; color:var(--ink-3)}
.ci{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c);
  border-radius:var(--radius); padding:13px 15px; margin-bottom:9px; box-shadow:var(--shadow)}
.ci .top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.ci .time{font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; color:var(--c)}
.ci .name{font-family:'Space Grotesk'; font-size:16px; font-weight:600; margin-top:2px}
.ci .acts{display:flex; gap:6px; margin-top:11px; flex-wrap:wrap}
.actbtn{border:1px solid var(--line-2); background:#fff; border-radius:8px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.actbtn:hover{background:var(--sel)}
.actbtn.on{color:#fff; border-color:transparent}
.actbtn.on.p{background:var(--campo)} .actbtn.on.f{background:var(--prova)} .actbtn.on.j{background:var(--medway)}

/* ---------- gráficos ---------- */
.stack{display:flex; height:9px; border-radius:99px; overflow:hidden; background:var(--line); margin-top:7px}
.stack i{display:block; height:100%}
.subrow{padding:11px 0; border-bottom:1px solid var(--line)}
.subrow:last-child{border-bottom:0}
.subrow .l1{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.subrow .nm{font-weight:600; font-size:13.5px}
.subrow .pc{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px}
.cols{display:flex; align-items:flex-end; gap:5px; height:132px; padding-top:6px}
.cols .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%}
.cols .col > i{width:100%; border-radius:5px 5px 2px 2px; min-height:2px; display:block}
.cols .col small{font-size:9.5px; color:var(--ink-3); font-family:'JetBrains Mono',monospace}
.alert{border:1px solid #f4d5df; background:var(--prova-bg); border-radius:var(--radius); padding:13px 16px; margin-bottom:14px}

/* ---------- week ---------- */
.weekbar{display:flex; gap:5px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:thin}
.wtab{
  border:1px solid var(--line-2); background:#fff; border-radius:9px; padding:7px 11px; min-width:74px;
  text-align:left; flex:0 0 auto
}
.wtab b{display:block; font-family:'Space Grotesk'; font-size:14px; font-weight:700}
.wtab span{font-size:10.5px; color:var(--ink-3)}
.wtab.on{background:var(--ink); border-color:var(--ink)}
.wtab.on b, .wtab.on span{color:#fff}
.wtab.now{border-color:var(--academia); box-shadow:0 0 0 2px var(--academia-bg)}

.days{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; margin-top:6px}
.day{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:13px; box-shadow:var(--shadow)}
.day.free{background:#fbfbf9; border-style:dashed}
.day .dh{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px}
.day .dh b{font-family:'Space Grotesk'; font-size:14px}
.day .dh span{font-size:11px; color:var(--ink-3)}
.addbtn{width:100%; border:1px dashed var(--line-2); background:none; color:var(--ink-3); border-radius:8px; padding:6px; font-size:12px}
.addbtn:hover{background:var(--sel); color:var(--ink-2)}

/* signature: ribbon */
.ribbon{position:relative; height:26px; background:#f6f5f2; border-radius:7px; margin:4px 0 10px; overflow:hidden; border:1px solid var(--line)}
.ribbon i{position:absolute; top:3px; bottom:3px; border-radius:4px; background:var(--c); opacity:.85}
.ribbon .free-i{background:repeating-linear-gradient(45deg,#e8e6e0,#e8e6e0 3px,transparent 3px,transparent 6px); opacity:1}
.ribbon .hr{position:absolute; top:0; bottom:0; width:1px; background:#e6e4de}
.ribbon-legend{display:flex; justify-content:space-between; font-size:9.5px; color:var(--ink-3); margin-top:-6px; margin-bottom:8px}

/* ---------- suggestion ---------- */
.sug{border:1px solid var(--line); border-left:3px solid var(--c); background:var(--bg); border-radius:9px; padding:10px 12px; margin-bottom:7px}
.sug .h{display:flex; justify-content:space-between; gap:10px; align-items:center}
.sug .w{font-size:11.5px; color:var(--ink-2); margin-top:4px}

/* ---------- table ---------- */
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line-2)}
td{padding:8px 10px; border-bottom:1px solid var(--line)}
tr:hover td{background:#fbfaf8}

/* ---------- modal / toast ---------- */
.backdrop{position:fixed; inset:0; background:rgba(27,27,26,.34); display:grid; place-items:center; padding:18px; z-index:60}
.modal{background:#fff; border-radius:14px; width:min(460px,100%); max-height:88vh; overflow:auto; padding:20px; box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
.modal h3{font-size:18px; margin-bottom:14px}
.hidden{display:none!important}
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:9px; font-size:13px; z-index:80; box-shadow:var(--shadow)}

/* ---------- workspaces ---------- */
.wsgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.wscard{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--c); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); cursor:pointer; text-align:left; transition:transform .1s ease}
.wscard:hover{transform:translateY(-2px)}
.wscard .ic{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:17px; color:#fff; background:var(--c)}
.wscard h4{font-family:'Space Grotesk'; font-size:16px; font-weight:600; margin:10px 0 3px}
.wscard .ds{font-size:12.5px; color:var(--ink-2); min-height:34px}
.wscard .ft{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px; border-top:1px solid var(--line)}
.wsnew{border:1.5px dashed var(--line-2); background:none; border-radius:var(--radius); padding:16px; color:var(--ink-3); min-height:150px; display:grid; place-items:center; text-align:center}
.wsnew:hover{background:var(--sel); color:var(--ink-2)}
.wshead{display:flex; gap:13px; align-items:flex-start; margin-bottom:16px}
.wshead .ic{width:46px; height:46px; border-radius:12px; display:grid; place-items:center; font-size:21px; color:#fff; background:var(--c); flex:0 0 auto}
.wstabs{display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:18px; padding-bottom:0}
.wstab{border:0; background:none; padding:9px 13px; color:var(--ink-3); font-weight:600; font-size:13px; border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px}
.wstab:hover{color:var(--ink-2)}
.wstab.on{color:var(--ink); border-bottom-color:var(--ink)}
.wstab .b{display:inline-block; min-width:17px; padding:0 5px; border-radius:99px; background:var(--sel); color:var(--ink-3); font-size:10.5px; margin-left:5px}
.av{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700;
  color:#fff; flex:0 0 auto; background-size:cover; background-position:center; position:relative}
.av.sm{width:25px; height:25px; font-size:9.5px}
.av.lg{width:52px; height:52px; font-size:17px}
.av .on{position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; border:2px solid var(--card); background:var(--ink-3)}
.av .on.live{background:var(--campo)}
.avstack{display:flex}
.avstack .av{margin-left:-8px; border:2px solid var(--card)}
.avstack .av:first-child{margin-left:0}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow); text-align:center}
.mcard .nm{font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; margin-top:9px}
.kan{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:start}
.kcol{background:#faf9f7; border:1px solid var(--line); border-radius:var(--radius); padding:11px; min-height:120px}
.kcol h5{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:0 0 10px; display:flex; justify-content:space-between}
.tcard{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:9px; padding:10px 12px; margin-bottom:7px; cursor:pointer; box-shadow:var(--shadow)}
.tcard:hover{transform:translateX(2px)}
.tcard .tt{font-weight:600; font-size:13px}
.tcard .mt{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:11px; color:var(--ink-3)}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal .wd{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-align:center; font-weight:600; padding-bottom:3px}
.cell{min-height:78px; border:1px solid var(--line); border-radius:9px; padding:5px 6px; background:var(--card); cursor:pointer}
.cell:hover{background:var(--sel)}
.cell.off{background:#fafaf8; border-style:dashed; opacity:.6}
.cell.now{border-color:var(--ink); box-shadow:0 0 0 1px var(--ink)}
.cell .dn{font-size:11px; font-weight:600; color:var(--ink-2)}
.cell .cev{font-size:10px; border-radius:4px; padding:2px 4px; margin-top:3px; background:var(--bg); color:var(--c); font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cmt{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt .bd{flex:1; min-width:0}
.cmt .hd{display:flex; gap:7px; align-items:baseline}
.cmt .hd b{font-size:13px}
.cmt .tx{font-size:13.5px; margin-top:3px; overflow-wrap:anywhere}
.cmt .rp{margin-left:34px; border-left:2px solid var(--line); padding-left:12px}
.wsinvite{display:flex; align-items:center; gap:8px; background:var(--sel); border-radius:9px; padding:8px 12px; font-family:'JetBrains Mono',monospace; font-weight:600; letter-spacing:.06em}

/* ---------- onboarding ---------- */
#onb{position:fixed; inset:0; z-index:100; background:var(--paper); overflow:auto; display:grid; place-items:center;
  padding:24px calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.onb-card{width:min(444px,100%)}
.onb-kicker{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.onb-title{font-family:'Space Grotesk'; font-size:27px; font-weight:700; letter-spacing:-.02em; margin:6px 0 4px}
.onb-sub{color:var(--ink-2); font-size:13px; margin-bottom:16px}
.onb-dots{display:flex; gap:6px; margin-bottom:20px}
.onb-dots i{height:4px; flex:1; border-radius:99px; background:var(--line-2)}
.onb-dots i.on{background:var(--ink)}
.obtn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; border-radius:10px; padding:11px;
  font-weight:600; border:1px solid var(--line-2); background:#fff; margin-bottom:8px}
.obtn:hover{background:var(--sel)}
.obtn.apple{background:#000; border-color:#000; color:#fff}
.obtn.apple:hover{background:#1c1c1c}
.osep{display:flex; align-items:center; gap:10px; color:var(--ink-3); font-size:11px; margin:13px 0}
.osep::before,.osep::after{content:''; flex:1; height:1px; background:var(--line)}
.pickgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.pick{border:1px solid var(--line-2); background:#fff; border-radius:10px; padding:12px 13px; font-weight:600; text-align:left; color:var(--ink-2)}
.pick:hover{background:var(--sel); color:var(--ink)}
.pick.on{background:var(--ink); border-color:var(--ink); color:#fff}
.drop{border:2px dashed var(--line-2); border-radius:14px; padding:32px 16px; text-align:center; color:var(--ink-2);
  background:#fff; cursor:pointer; transition:border-color .12s, background .12s}
.drop.over{border-color:var(--estudo); background:var(--estudo-bg)}
.fi{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:9px; padding:8px 11px; margin-top:8px; background:#fff}
.fi .fx{width:32px; height:32px; border-radius:7px; display:grid; place-items:center; font-size:9.5px; font-weight:700; color:#fff; flex:0 0 auto; text-transform:uppercase}
.onb-err{color:var(--prova); font-size:12.5px; margin-top:8px; min-height:17px}
.onb-foot{margin-top:14px; display:flex; justify-content:space-between; align-items:center; gap:10px}
.spin{display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px; margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- variantes de dispositivo ---------- */
html.dev-tablet .sidebar{width:198px; flex-basis:198px}
html.dev-tablet main{padding:28px 24px 90px}
html.dev-tablet .days{grid-template-columns:repeat(2,1fr)}
html.dev-mobile .app{flex-direction:column}
html.dev-mobile .sidebar{position:fixed; left:0; right:0; bottom:0; top:auto; width:auto; height:auto; display:flex; gap:2px;
  overflow-x:auto; border-right:0; border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));

<script>
/* MODO PRÉ-VISUALIZAÇÃO
   true  = abre direto no planner, sem telas de conta (nada foi apagado do código)
   false = volta o fluxo completo: cadastro → nome → curso → período → arquivos */
const SKIP_AUTH = true;

/* ============================================================
   Adaptador de persistência standalone
   O Store (abaixo) fala com window.storage — a API do ambiente
   onde este planner foi criado. Num navegador comum ela não
   existe, e sem este adaptador toda gravação falharia em
   silêncio (o try/catch do io engoliria o TypeError). Aqui,
   quando window.storage não existe, ela é implementada sobre
   localStorage com o mesmo contrato ({ value } no get).
============================================================ */
if (!window.storage) {
  window.storage = {
    async get(k){ const v = localStorage.getItem(k); return v === null ? null : { value: v }; },
    async set(k, v){ localStorage.setItem(k, String(v)); },
  };
}

/* dispositivo: 'auto' detecta pela largura; as variantes fixam 'mobile' | 'tablet' | 'desktop' */
const DEVICE = 'auto';
document.documentElement.classList.add('dev-' + (DEVICE === 'auto'
  ? (innerWidth < 700 ? 'mobile' : innerWidth < 1100 ? 'tablet' : 'desktop') : DEVICE));

/* ============================================================
   0. KERNEL — infraestrutura compartilhada
   ------------------------------------------------------------
   Nenhum domínio conhece outro. Todos conhecem o Kernel.
   Camadas: KERNEL → DOMAIN SERVICES → APPLICATION → VIEWS
   ============================================================ */

/* ---------- 0.1 html: escape por padrão ---------- */
const RAW = Symbol('raw');
const escHTML = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const raw = v => ({[RAW]: String(v)});
function interp(v){
  if (v === null || v === undefined || v === false) return '';
  if (Array.isArray(v)) return v.map(interp).join('');
  if (typeof v === 'object' && v[RAW] !== undefined) return v[RAW];
  return escHTML(v);
}
/* html`<p>${userInput}</p>` escapa sozinho; use raw(x) para injetar marcação confiável */
function html(strings, ...vals){
  let out = strings[0];
  for (let i = 0; i < vals.length; i++) out += interp(vals[i]) + strings[i+1];
  return raw(out);
}
/* Desempacota o resultado de html`` (raw) ou aceita HTML já montado pelas views
   legadas. O escape acontece dentro de html`` — este ponto só desembrulha. */
const toHTML = v => (v && typeof v === 'object' && v[RAW] !== undefined) ? v[RAW] : String(v ?? '');
const esc = escHTML;                       // alias histórico, mesma função
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c === 'x' ? r : (r&0x3|0x8)).toString(16); }));

/* ---------- 0.2 Store: namespaces, versão, migrações, debounce, onChange ---------- */
const Store = (() => {
  const DEBOUNCE = 400;
  const spaces = new Map();
  const io = {
    async get(k){ try { const r = await window.storage.get(k); return r && r.value ? JSON.parse(r.value) : null; } catch(e){ return null; } },
    async set(k, v){ try { await window.storage.set(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
    setSync(k, v){ try { window.storage.set(k, JSON.stringify(v)); } catch(e){} }
  };

  class Namespace {
    constructor(name, opts){
      this.name = name;
      this.key = 'estudy:' + name;
      this.schemaVersion = opts.schemaVersion || 1;
      this.migrations = opts.migrations || {};       // { 2: fn, 3: fn } — leva da versão n-1 para n
      this.legacyKey = opts.legacyKey || null;       // chave do formato antigo, adotada uma única vez
      this.adopt = opts.adopt || (x => x);
      this.data = null; this.dirty = false; this.saving = false; this.timer = null;
      this.listeners = new Set();
      this.loadedFrom = null;
    }
    async load(seed, ctx){
      let env = await io.get(this.key);
      if (!env && this.legacyKey){
        const legacy = await io.get(this.legacyKey);
        if (legacy){ env = {v:1, data:this.adopt(legacy)}; this.loadedFrom = 'legacy:' + this.legacyKey; }
      }
      if (!env || env.data === null || env.data === undefined){
        this.data = typeof seed === 'function' ? seed() : (seed ?? null);
        this.loadedFrom = this.loadedFrom || 'seed';
        this.touch();
      } else {
        const from = env.v || 1;
        this.data = this.migrate(from, env.data, ctx || {});
        this.loadedFrom = this.loadedFrom || 'storage';
        if (from !== this.schemaVersion) this.touch();       // grava já migrado
      }
      return this.data;
    }
    migrate(from, data, ctx){
      for (let v = from + 1; v <= this.schemaVersion; v++){
        const step = this.migrations[v];
        if (typeof step === 'function'){
          try { data = step(data, ctx) ?? data; }
          catch(e){ console.error('[Store] migração', this.name, '→ v'+v, e); }
        }
      }
      return data;
    }
    get(){ return this.data; }
    set(d){ this.data = d; this.touch(); return d; }
    touch(){
      this.dirty = true;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), DEBOUNCE);
      this.listeners.forEach(fn => { try { fn(this.data, this.name); } catch(e){ console.error('[Store] onChange', e); } });
    }
    onChange(fn){ this.listeners.add(fn); return () => this.listeners.delete(fn); }
    envelope(){ return {v:this.schemaVersion, at:new Date().toISOString(), data:this.data}; }
    async flush(){
      if (this.saving || !this.dirty) return;
      this.saving = true; this.dirty = false;
      await io.set(this.key, this.envelope());
      this.saving = false;
      if (this.dirty) this.flush();
    }
    flushSync(){ if (this.dirty) io.setSync(this.key, this.envelope()); }
  }

  return {
    namespace(name, opts = {}){ if (!spaces.has(name)) spaces.set(name, new Namespace(name, opts)); return spaces.get(name); },
    ns(name){ return spaces.get(name); },
    list(){ return [...spaces.values()].map(s => ({name:s.name, key:s.key, v:s.schemaVersion, from:s.loadedFrom})); },
    flushAll(){ spaces.forEach(s => s.flushSync()); }
  };
})();
window.addEventListener('beforeunload', () => Store.flushAll());

/* ---------- 0.3 Bus: eventos de domínio nomeados ---------- */
const DOMAIN_EVENTS = Object.freeze([
  'identity.session.started', 'identity.session.ended', 'identity.profile.updated',
  'user.upserted',
  'planner.event.created', 'planner.event.updated', 'planner.event.deleted',
  'planner.attendance.recorded', 'planner.plan.imported',
  'workspace.created', 'workspace.updated', 'workspace.deleted', 'workspace.opened',
  'workspace.member.added', 'workspace.member.updated', 'workspace.member.removed',
  'workspace.invite.created', 'workspace.invite.redeemed', 'workspace.invite.revoked',
  'workspace.task.created', 'workspace.task.updated', 'workspace.task.deleted',
  'workspace.event.created', 'workspace.event.updated', 'workspace.event.deleted',
  'workspace.asset.uploaded', 'workspace.asset.removed',
  'workspace.activity.created',
  'asset.processed', 'ai.job.started', 'ai.job.completed', 'ai.job.failed',
  'notification.created', 'sync.requested'
]);
const Bus = (() => {
  const subs = new Map(); const trail = [];
  return {
    on(name, fn){
      if (!subs.has(name)) subs.set(name, new Set());
      subs.get(name).add(fn);
      return () => subs.get(name).delete(fn);
    },
    emit(name, payload = {}){
      if (!DOMAIN_EVENTS.includes(name)) console.warn('[Bus] evento não declarado em DOMAIN_EVENTS:', name);
      trail.push({name, at:Date.now()});
      if (trail.length > 200) trail.shift();
      const set = subs.get(name);
      if (set) set.forEach(fn => { try { fn(payload, name); } catch(e){ console.error('[Bus]', name, e); } });
    },
    catalog(){ return DOMAIN_EVENTS.slice(); },
    trail(){ return trail.slice(); }
  };
})();

/* ---------- 0.4 Actions: registry no lugar da cadeia de ifs ---------- */
const Actions = (() => {
  const map = new Map(), alias = new Map();
  const api = {
    register(name, fn){ map.set(name, fn); return api; },
    /* ponte para a marcação existente: data-wsopen → 'workspace.open' */
    bind(datasetKey, name){ alias.set(datasetKey, name); return api; },
    has(name){ return map.has(name); },
    names(){ return [...map.keys()].sort(); },
    bindings(){ return [...alias.entries()]; },
    run(name, payload, el, ev){
      const fn = map.get(name);
      if (!fn) return false;
      try { const r = fn(payload || {}, el, ev); if (r && r.catch) r.catch(e => console.error('[Action]', name, e)); }
      catch(e){ console.error('[Action]', name, e); }
      return true;
    },
    dispatch(ev){
      let el = ev.target && ev.target.nodeType === 1 ? ev.target : null;
      while (el){
        const ds = el.dataset;
        if (ds){
          if (ds.action && map.has(ds.action)) return api.run(ds.action, {value:ds.value, ...ds}, el, ev);
          for (const k in ds){
            const name = alias.get(k);
            if (name && map.has(name)) return api.run(name, {value:ds[k], ...ds}, el, ev);
          }
        }
        el = el.parentElement;
      }
      return false;
    }
  };
  return api;
})();

/* ---------- 0.5 Regions: atualização parcial de tela ---------- */
const Regions = (() => {
  const defs = new Map();
  return {
    define(name, def){ defs.set(name, def); },                     // {render(ctx), after(el, ctx)}
    mount(name, ctx){ const d = defs.get(name); return `<div data-region="${name}">${d ? toHTML(d.render(ctx)) : ''}</div>`; },
    update(name, ctx){
      const d = defs.get(name), el = document.querySelector('[data-region="' + name + '"]');
      if (!d || !el) return false;
      el.innerHTML = toHTML(d.render(ctx));
      if (d.after) d.after(el, ctx);
      return true;
    },
    list(){ return [...defs.keys()]; }
  };
})();

/* ---------- 0.6 Router: hash routes ---------- */
const Router = (() => {
  let guard = false, build = () => '', apply = () => false;
  return {
    configure(builder, applier){ build = builder; apply = applier; },
    path(){ return location.hash.replace(/^#/, ''); },
    sync(){
      const want = build();
      if (!want || this.path() === want) return;
      guard = true; location.hash = want;
      setTimeout(() => { guard = false; }, 0);
    },
    go(path){ if (this.path() !== path) location.hash = path; },
    start(onApplied){
      window.addEventListener('hashchange', () => {
        if (guard) return;
        const p = this.path();
        if (p && p !== build() && apply(p) && onApplied) onApplied();
      });
      const p = this.path();
      if (p) apply(p);
    }
  };
})();

/* ---------- 0.7 Identity: única fonte de verdade do usuário ---------- */
const Identity = (() => {
  let rec = null, ns = null;
  const blank = () => ({
    userId: uuid(), username:'', email:'', passHash:null, provider:null,
    name:'', course:'', institution:'', period:'', avatarUrl:null, onboarded:false, signedIn:false, files:[]
  });
  const api = {
    async init(){
      ns = Store.namespace('identity', {
        schemaVersion: 2,
        legacyKey: 'planner_profile_v1',
        migrations: { 2: (d) => { if (d && !d.userId) d.userId = uuid(); return d; } }
      });
      rec = await ns.load(blank);
      if (!rec.userId){ rec.userId = uuid(); ns.touch(); }
      /* O UserRef existe desde o primeiro boot: é a identidade do aparelho.
         A sessão é outra coisa e só é anunciada quando há login. */
      Bus.emit('identity.profile.updated', {user: api.ref()});
      if (rec.signedIn) Bus.emit('identity.session.started', {user: api.ref()});
      return rec;
    },
    current(){ return rec; },
    /* contrato público: nenhum domínio recebe o registro, só esta referência */
    ref(){ return {id: rec.userId, displayName: rec.name || rec.username || 'Você', avatarUrl: rec.avatarUrl || null}; },
    merge(patch, opts = {}){
      Object.assign(rec, patch);
      if (!rec.userId) rec.userId = uuid();
      if (opts.persist !== false) ns.touch();
      Bus.emit('identity.profile.updated', {user: api.ref()});
      if (rec.signedIn) Bus.emit('identity.session.started', {user: api.ref()});
      return rec;
    },
    commit(){ ns.touch(); },
    signOut(){ rec.signedIn = false; ns.touch(); Bus.emit('identity.session.ended', {}); }
  };
  return api;
})();

const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOW_LONG = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const d = s => new Date(s + 'T00:00:00');
const iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addDays = (s,n) => { const x = d(s); x.setDate(x.getDate()+n); return iso(x); };
const dow = s => d(s).getDay();
const fmtBR = s => { const x = d(s); return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0'); };
const fmtLong = s => { const x = d(s); return DOW_LONG[x.getDay()]+', '+x.getDate()+' de '+MONTHS[x.getMonth()].toLowerCase(); };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const toHHMM = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const uid = () => 'e'+Math.random().toString(36).slice(2,9);
/* esc: definido no Kernel (0.1) */
const TODAY = iso(new Date());

WEEKS.forEach(w => { w.end = addDays(w.start,6); });
function weekOf(date){
  const hit = _wk.get(date);
  if (hit) return hit;
  let id = date < WEEKS[0].start ? WEEKS[0].id : WEEKS[WEEKS.length-1].id;
  for (const w of WEEKS) if (date >= w.start && date <= w.end){ id = w.id; break; }
  _wk.set(date, id);
  return id;
}
function weekMeta(id){ return WEEKS.find(w => w.id === id) || WEEKS[0]; }
function currentWeekId(){
  for (const w of WEEKS) if (TODAY <= w.end) return w.id;
  return WEEKS[WEEKS.length-1].id;
}

});

/* --- índices (evitam varrer os 160 eventos a cada consulta) --- */
let _idx = null;
const _wk = new Map();
function invalidate(){ _idx = null; }
function idx(){
  if (!_idx){
    _idx = new Map();
    for (const e of state.events){
      let a = _idx.get(e.date);
      if (!a) _idx.set(e.date, a = []);
      a.push(e);
    }
    for (const a of _idx.values()) a.sort((x,y) => toMin(x.start)-toMin(y.start) || x.title.localeCompare(y.title));
  }
  return _idx;
}

function seedState(){

const evsOn = date => idx().get(date) || [];

  .sort((a,b) => a.date.localeCompare(b.date) || toMin(a.start) - toMin(b.start));
const weekDays = id => { const w = weekMeta(id); return Array.from({length:7}, (_,i) => addDays(w.start,i)); };
const isAcad = e => !['ACADEMIA','ESTUDO','PESSOAL'].includes(e.type);

/* ============================================================
   4. MOTOR DE JANELAS LIVRES / SUGESTÕES
   ============================================================ */
const DAY_OPEN = 5*60+30, DAY_CLOSE = 22*60+30;

function busyOn(date, onlyAcademic){
  return evsOn(date).filter(e => onlyAcademic ? isAcad(e) : true)
    .map(e => [toMin(e.start), toMin(e.end)])
    .sort((a,b) => a[0]-b[0])
    .reduce((acc,iv) => {
      const last = acc[acc.length-1];
      if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else acc.push(iv.slice());
      return acc;
    }, []);
}
function gapsOn(date, onlyAcademic){
  const busy = busyOn(date, onlyAcademic);
  const gaps = []; let cur = DAY_OPEN;
  for (const [s,e] of busy){ if (s - cur >= 45) gaps.push([cur, s]); cur = Math.max(cur, e); }
  if (DAY_CLOSE - cur >= 45) gaps.push([cur, DAY_CLOSE]);
  return gaps;
}

/* gera sugestões de academia/estudo para um dia */
function suggestDay(date){
  const busy = busyOn(date, true);
  const gaps = gapsOn(date, true);
  const out = [];
  const wd = dow(date);
  const already = evsOn(date).filter(e => !isAcad(e));
  const has = kind => already.some(e => e.type === kind);

  if (!busy.length){
    // dia inteiro livre
    if (!has('ACADEMIA')) out.push({s:8*60, e:9*60+15, kind:'ACADEMIA', why:'Dia sem atividade oficial — treino cedo mantém a rotina no lugar.'});
    if (!has('ESTUDO')) out.push({s:9*60+45, e:11*60+45, kind:'ESTUDO', why:'Bloco longo de revisão: o melhor momento da semana para conteúdo pesado.'});
    if (!has('ESTUDO')) out.push({s:14*60+30, e:16*60+30, kind:'ESTUDO', why:'Segundo bloco: questões comentadas ou banco de provas.'});
    out.push({s:19*60, e:21*60, kind:'PESSOAL', why:'Descanso protegido. Dia livre também serve para não zerar a bateria.'});
    return out;
  }

  const firstStart = busy[0][0], lastEnd = busy[busy.length-1][1];

  // treino antes do campo
  if (firstStart >= 7*60 && firstStart - DAY_OPEN >= 75 && !has('ACADEMIA'))
    out.push({s:Math.max(DAY_OPEN, firstStart-85), e:Math.max(DAY_OPEN, firstStart-85)+60, kind:'ACADEMIA', why:'Treino antes do plantão: 60 min e ainda sobra tempo para o deslocamento.'});

  // vãos internos
  gaps.forEach(([gs,ge]) => {
    const len = ge - gs;
    if (gs < firstStart) return;                 // já tratado acima
    if (len >= 100 && gs >= 9*60 && gs < 18*60)
      out.push({s:gs+15, e:Math.min(gs+15+Math.min(len-30,120), ge-10), kind:'ESTUDO', why:'Vão entre atividades — revisar o caso que você acabou de ver rende o dobro.'});
    else if (len >= 75 && gs >= 16*60 && gs < 20*60 && !has('ACADEMIA') && !out.some(o => o.kind==='ACADEMIA'))
      out.push({s:gs+10, e:gs+80, kind:'ACADEMIA', why:'Janela do fim de tarde livre: encaixe o treino aqui.'});
  });

  // depois de tudo
  if (lastEnd <= 19*60 && !out.some(o => o.kind==='ACADEMIA') && !has('ACADEMIA'))
    out.push({s:lastEnd+45, e:lastEnd+45+70, kind:'ACADEMIA', why:'Dia termina cedo — treino logo após o campo, antes de perder o embalo.'});
  if (lastEnd <= 21*60 && lastEnd >= 19*60 && !has('ESTUDO'))
    out.push({s:21*60+15, e:22*60+15, kind:'ESTUDO', why:'Revisão curta do que caiu na teoria de hoje (Anki / resumo de 1 página).'});
  else if (lastEnd < 19*60 && !has('ESTUDO'))
    out.push({s:20*60, e:21*60+30, kind:'ESTUDO', why:'Noite livre: bloco fixo de estudo para não acumular conteúdo até a prova.'});

  return out.filter(o => o.e <= DAY_CLOSE && o.e > o.s);
}

/* ---- estatísticas de presença (alimentadas pelo check-in) ---- */
const MIN_PCT = 75; // limite de risco

function stats(list){
  const s = {presente:0, falta:0, justificada:0, pendente:0, total:list.length};
  list.forEach(e => s[stOf(e)]++);
  s.registrados = s.presente + s.falta + s.justificada;
  s.pct = s.registrados ? Math.round((s.presente + s.justificada)/s.registrados*100) : null;
  s.horasFalta = list.filter(e => stOf(e)==='falta').reduce((a,e)=>a+(toMin(e.end)-toMin(e.start))/60,0);
  return s;
}
function bySubject(scope){
  const map = new Map();
  state.events.filter(isAcad).filter(e => scope==='all' || weekMeta(weekOf(e.date)).mod === scope)
    .forEach(e => {
      const k = subjectOf(e);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(e);
    });
  return [...map.entries()].map(([name, evs]) => ({name, type:evs[0].type, evs, ...stats(evs)}));
}
function pctColor(p){ return p === null ? 'var(--ink-3)' : p < MIN_PCT ? 'var(--prova)' : p < 90 ? 'var(--medway)' : 'var(--campo)'; }
const pendingBefore = date => state.events.filter(isAcad)
  .filter(e => e.date < date && stOf(e) === 'pendente')
  .sort((a,b) => b.date.localeCompare(a.date) || toMin(a.start)-toMin(b.start));

function nextExam(from){
  return state.events.filter(e => e.type === 'PROVA' && e.date >= from)
    .sort((a,b) => a.date.localeCompare(b.date))[0];
}

    </div>
  </div>`;
}

function ribbonHTML(date){
  const span = DAY_CLOSE - DAY_OPEN;
  const pct = m => ((m - DAY_OPEN)/span*100);
  let bars = evsOn(date).map(e => {
    const t = TYPES[e.type] || TYPES.PESSOAL;
    const a = Math.max(DAY_OPEN, toMin(e.start)), b = Math.min(DAY_CLOSE, toMin(e.end));
    if (b <= a) return '';
    return `<i style="--c:${t.c};left:${pct(a)}%;width:${Math.max(pct(b)-pct(a),1.2)}%" title="${esc(e.title)}"></i>`;
  }).join('');
  const marks = [8,12,16,20].map(h => `<span class="hr" style="left:${pct(h*60)}%"></span>`).join('');
  return `<div class="ribbon">${marks}${bars}</div>
    <div class="ribbon-legend mono"><span>05:30</span><span>12:00</span><span>18:00</span><span>22:30</span></div>`;
}

function dayCard(date, opts={}){
  const list = evsOn(date);
  const free = list.length === 0;
  return `<div class="day${free?' free':''}">
    <div class="dh"><b>${DOW[dow(date)]} ${fmtBR(date)}</b>
      <span>${free ? 'dia livre' : list.length+(list.length>1?' atividades':' atividade')}</span></div>

  </div>`;
}

}

/* ---------- GRÁFICOS DE PRESENÇA ---------- */
R.charts = () => {
  const scoped = state.events.filter(isAcad)
    .filter(e => chartScope==='all' || weekMeta(weekOf(e.date)).mod === chartScope);
  const g = stats(scoped);
  const subs = bySubject(chartScope).sort((a,b) => b.falta - a.falta || b.total - a.total || a.name.localeCompare(b.name));
  const risco = subs.filter(x => x.pct !== null && x.pct < MIN_PCT);
  const C = 2*Math.PI*52, p = (g.pct ?? 0)/100;

  const byType = Object.keys(TYPES).filter(k => !['ACADEMIA','ESTUDO','PESSOAL'].includes(k))
    .map(k => ({k, ...stats(scoped.filter(e => e.type === k))})).filter(x => x.total);

  const weeksData = WEEKS.map(w => {
    const evs = scoped.filter(e => weekOf(e.date) === w.id);
    return {id:w.id, ...stats(evs)};
  }).filter(x => x.total);

  const stackHTML = x => `<div class="stack">
      <i style="width:${x.presente/x.total*100}%;background:var(--campo)"></i>
      <i style="width:${x.justificada/x.total*100}%;background:var(--medway)"></i>
      <i style="width:${x.falta/x.total*100}%;background:var(--prova)"></i>
      <i style="width:${x.pendente/x.total*100}%;background:var(--line-2)"></i>
    </div>`;

  return `
  <div class="page-head">
    <div class="kicker">Alimentado pelo check-in diário</div>
    <h1>Presença por matéria</h1>
    <p>Cada registro feito na aba Check-in entra nestes gráficos. A porcentagem considera apenas o que já foi registrado — faltas justificadas contam como presença, mas aparecem separadas.</p>
  </div>

  ${risco.length ? `<div class="alert">
    <b style="color:var(--prova)">Atenção: ${risco.length} matéria${risco.length>1?'s':''} abaixo de ${MIN_PCT}%</b>
    <div class="small" style="margin-top:5px">${risco.map(x => esc(x.name)+' ('+x.pct+'%)').join(' · ')}</div>
  </div>` : ''}

  <div class="chips" style="margin-bottom:18px">
    <button class="chip${chartScope==='all'?' on':''}" data-scope="all">Semestre inteiro</button>
    ${[...new Set(WEEKS.map(w=>w.mod))].map(m=>`<button class="chip${chartScope===m?' on':''}" data-scope="${m}">${MOD_NAME[m]||m}</button>`).join('')}
  </div>

  <div class="card pad" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
    <svg viewBox="0 0 120 120" width="128" height="128" role="img" aria-label="Presença geral ${g.pct ?? 0}%">
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="13"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="${pctColor(g.pct)}" stroke-width="13" stroke-linecap="round"
        stroke-dasharray="${(p*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="58" text-anchor="middle" font-family="Space Grotesk" font-size="26" font-weight="700" fill="var(--ink)">${g.pct===null?'—':g.pct+'%'}</text>
      <text x="60" y="75" text-anchor="middle" font-family="Inter" font-size="9" fill="var(--ink-3)">presença</text>
    </svg>
    <div style="flex:1;min-width:240px">
      <div class="grid g4" style="gap:10px">
        <div><div class="mono" style="font-size:21px;font-weight:600;color:var(--campo)">${g.presente}</div><div class="small muted">presenças</div></div>
        <div><div class="mono" style="font-size:21px;font-weight:600;color:var(--prova)">${g.falta}</div><div class="small muted">faltas</div></div>
        <div><div class="mono" style="font-size:21px;font-weight:600;color:var(--medway)">${g.justificada}</div><div class="small muted">justificadas</div></div>
        <div><div class="mono" style="font-size:21px;font-weight:600;color:var(--ink-3)">${g.pendente}</div><div class="small muted">sem registro</div></div>
      </div>
      ${stackHTML(g)}
      <div class="small muted" style="margin-top:8px">${g.horasFalta.toFixed(0)}h de atividade perdidas em faltas não justificadas · ${g.registrados} de ${g.total} atividades já registradas.</div>
    </div>
  </div>

  <div class="sec-title">Presença por matéria (${subs.length})</div>
  <div class="card pad">
    ${subs.length ? subs.map(x => {
      const t = TYPES[x.type] || TYPES.PESSOAL;
      return `<div class="subrow">
        <div class="l1">
          <div class="nm"><span class="dot" style="background:${t.c}"></span> ${esc(x.name)}
            <span class="small muted" style="font-weight:400">· ${x.total} aula${x.total>1?'s':''}</span></div>
          <div class="pc" style="color:${pctColor(x.pct)}">${x.pct===null?'—':x.pct+'%'}</div>
        </div>
        ${stackHTML(x)}
        <div class="small muted" style="margin-top:5px">
          ${x.presente} presença${x.presente===1?'':'s'} · ${x.falta} falta${x.falta===1?'':'s'} · ${x.justificada} justificada${x.justificada===1?'':'s'} · ${x.pendente} sem registro
        </div>
      </div>`;
    }).join('') : '<div class="muted small">Sem atividades neste recorte.</div>'}
  </div>

  <div class="grid g2" style="margin-top:22px">
    <div>
      <div class="sec-title" style="margin-top:0">Por tipo de atividade</div>
      <div class="card pad">
        ${byType.map(x => `<div class="subrow">
          <div class="l1"><div class="nm"><span class="dot" style="background:${TYPES[x.k].c}"></span> ${TYPES[x.k].label}</div>
          <div class="pc" style="color:${pctColor(x.pct)}">${x.pct===null?'—':x.pct+'%'}</div></div>
          ${stackHTML(x)}
          <div class="small muted" style="margin-top:5px">${x.registrados}/${x.total} registradas · ${x.falta} falta${x.falta===1?'':'s'}</div>
        </div>`).join('')}
      </div>
    </div>
    <div>
      <div class="sec-title" style="margin-top:0">Evolução semana a semana</div>
      <div class="card pad">
        <div class="cols">
          ${weeksData.map(x => `<div class="col" title="${x.id}: ${x.pct===null?'sem registro':x.pct+'% · '+x.falta+' falta(s)'}">
            <i style="height:${x.pct===null?4:Math.max(x.pct,4)}%;background:${x.pct===null?'var(--line-2)':pctColor(x.pct)}"></i>
            <small>${x.id.slice(1)}</small></div>`).join('')}
        </div>
        <div class="small muted" style="margin-top:10px">Altura = % de presença registrada na semana. Cinza = semana ainda sem check-in.</div>
      </div>
      <div class="sec-title">Legenda</div>
      <div class="card pad small">
        <span class="dot" style="background:var(--campo)"></span> presença &nbsp;
        <span class="dot" style="background:var(--medway)"></span> justificada &nbsp;
        <span class="dot" style="background:var(--prova)"></span> falta &nbsp;
        <span class="dot" style="background:var(--line-2)"></span> sem registro<br><br>
        <span class="muted">Vermelho abaixo de ${MIN_PCT}%, amarelo entre ${MIN_PCT}% e 89%, verde de 90% para cima. Ajuste os registros a qualquer momento pela aba Check-in ou clicando na atividade em qualquer tela.</span>
      </div>
    </div>
  </div>`;
};

  const ex = nextExam(TODAY);
  const days = ex ? Math.round((d(ex.date) - d(TODAY))/86400000) : 0;
  const byType = Object.keys(TYPES).map(k => [k, all.filter(e => e.type === k).length]).filter(x => x[1]);
  const freeDays = WEEKS.flatMap(w => weekDays(w.id)).filter(dt => dt >= TODAY && !evsOn(dt).length).length;
  const provas = all.filter(e => e.type === 'PROVA').sort((a,b) => a.date.localeCompare(b.date));

  return `
  <div class="page-head">
    <div class="kicker">${WEEKS[0].id} → ${WEEKS[WEEKS.length-1].id} · ${fmtBR(WEEKS[0].start)} a ${fmtBR(WEEKS[WEEKS.length-1].end)}</div>
    <h1>Visão geral</h1>

  </div>

  <div class="grid g4">
    <div class="card stat"><div class="n" style="color:${pctColor(g.pct)}">${g.pct===null?'—':g.pct+'%'}</div><div class="l">presença registrada</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="l">${g.registrados} de ${acad.length} atividades com check-in · ${g.falta} falta${g.falta===1?'':'s'}</div></div>
    <div class="card stat"><div class="n">${ex ? days : '—'}</div><div class="l">${ex ? `dias até a ${esc(ex.title)} <span class="mono">(${fmtBR(ex.date)})</span>` : 'nenhuma prova pendente'}</div></div>
    <div class="card stat"><div class="n">${freeDays}</div><div class="l">dias sem atividade oficial restantes</div></div>

  </div>

  <div class="sec-title">Próximas atividades</div>
  <div class="card pad">${upcoming.map(e => evHTML(e, true)).join('') || '<div class="muted small">Semestre concluído.</div>'}</div>

  <div class="grid g2" style="margin-top:22px">
    <div>
      <div class="sec-title" style="margin-top:0">Calendário de provas</div>
      <div class="card pad">${provas.map(e => evHTML(e, true)).join('')}</div>
    </div>
    <div>
      <div class="sec-title" style="margin-top:0">Composição do semestre</div>
      <div class="card pad">
        ${byType.map(([k,n]) => {
          const t = TYPES[k], max = Math.max(...byType.map(x => x[1]));
          return `<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px">
              <span><span class="dot" style="background:${t.c}"></span> ${t.label}</span><b class="mono">${n}</b></div>
            <div class="bar"><i style="width:${n/max*100}%;background:${t.c}"></i></div></div>`;
        }).join('')}
      </div>
      <div class="sec-title">Rodízios</div>
      <div class="card pad small">
        <b>Rodízio 1 — SMI</b> · S02 a S11 · 27/07 → 04/10<br>
        <span class="muted">Teoria GO nas segundas e Teoria Ped nas quartas, 19:00–21:00.</span><br><br>

  </div>`;
};

R.weeks = () => {
  const w = weekMeta(weekSel);
  const days = weekDays(weekSel);
  const list = evsInWeek(weekSel);
  const freeDays = days.filter(dt => !evsOn(dt).length);
  const horas = list.filter(isAcad).reduce((s,e) => s + (toMin(e.end)-toMin(e.start))/60, 0);
  const note = state.notes[weekSel] || '';

  return `
  <div class="page-head">
    <div class="kicker">${w.rod} · ${MOD_NAME[w.mod]}</div>
    <h1>Semana ${w.id.slice(1)} <span class="muted" style="font-weight:400">· ${fmtBR(w.start)} a ${fmtBR(w.end)}</span></h1>
  </div>

  <div class="weekbar">${WEEKS.map(x => `<button class="wtab${x.id===weekSel?' on':''}${x.id===currentWeekId()?' now':''}" data-week="${x.id}">
      <b>${x.id}</b><span>${fmtBR(x.start)}–${fmtBR(x.end)}</span></button>`).join('')}</div>

  <div class="row" style="margin-bottom:14px">
    <div class="card pad" style="flex:1;min-width:150px"><div class="small muted">Atividades</div><b class="mono" style="font-size:19px">${list.filter(isAcad).length}</b></div>
    <div class="card pad" style="flex:1;min-width:150px"><div class="small muted">Carga horária</div><b class="mono" style="font-size:19px">${horas.toFixed(0)}h</b></div>

  ${typeLegend()}

  <div class="days">${days.map(dt => dayCard(dt)).join('')}</div>

  <div class="sec-title">Anotações da semana</div>
  <textarea id="weeknote" placeholder="Casos para revisar, pendências de prontuário, o que combinar com o preceptor…"

R.search = () => {
  const q = searchQ.trim().toLowerCase();
  let res = state.events.slice();
  if (searchTypes.size) res = res.filter(e => searchTypes.has(e.type));
  if (q) res = res.filter(e =>
    e.title.toLowerCase().includes(q) || (e.note||'').toLowerCase().includes(q) ||
    (TYPES[e.type]?.label.toLowerCase().includes(q)) || weekOf(e.date).toLowerCase() === q ||
    fmtBR(e.date).includes(q) || DOW_LONG[dow(e.date)].toLowerCase().startsWith(q));
  res.sort((a,b) => a.date.localeCompare(b.date) || toMin(a.start)-toMin(b.start));

  const groups = {};
  res.forEach(e => { (groups[weekOf(e.date)] ||= []).push(e); });

  return `
  <div class="page-head">
    <div class="kicker">Busca</div>
    <h1>Buscar no planner</h1>
    <p>Procure por rotação (“cardiologia”), tipo (“prova”), semana (“S14”), dia da semana (“quinta”) ou data (“12/11”).</p>
  </div>

  <input id="q" value="${esc(searchQ)}" placeholder="Buscar atividade, semana, data…" autocomplete="off"
    style="width:100%;border:1px solid var(--line-2);border-radius:11px;padding:13px 15px;font-size:15px;margin-bottom:12px">

  <div class="chips" style="margin-bottom:16px">
    ${Object.entries(TYPES).map(([k,t]) => `<button class="chip${searchTypes.has(k)?' on':''}" data-ftype="${k}">
      <span class="dot" style="background:${searchTypes.has(k)?'#fff':t.c}"></span> ${t.label}</button>`).join('')}
    ${searchTypes.size ? '<button class="chip" data-ftype="__clear">limpar filtros</button>' : ''}
  </div>

  <div class="small muted" style="margin-bottom:10px">${res.length} resultado${res.length===1?'':'s'}</div>

  ${res.length ? Object.keys(groups).map(wk => {
    const m = weekMeta(wk);
    return `<div style="margin-bottom:18px">
      <div class="sec-title" style="margin:0 0 8px">${wk} · ${fmtBR(m.start)}–${fmtBR(m.end)} · ${m.mod}</div>
      <div class="card pad">${groups[wk].map(e => evHTML(e, true)).join('')}
      <button class="btn sm" data-goweek="${wk}" style="margin-top:6px">Abrir semana ${wk}</button></div>
    </div>`;
  }).join('') : `<div class="empty">Nada encontrado. Tente “teoria”, “prova AV3”, “S09” ou “urologia”.</div>`}`;
};

    </div>
    <div class="card pad" style="flex:1.4;min-width:220px">

function openEditor(ev, presetDate){
  const e = ev || {id:null, date:presetDate||TODAY, start:'07:00', end:'13:00', type:'CAMPO', title:'', note:'', done:false, custom:true};
  document.getElementById('modal').innerHTML = `
    <h3>${ev ? 'Editar atividade' : 'Nova atividade'}</h3>
    <div class="field"><label>Nome</label><input id="f_title" value="${esc(e.title)}" placeholder="Ex.: Ambulatório de Cardiologia"></div>
    <div class="row">
      <div class="field" style="flex:1"><label>Data</label><input id="f_date" type="date" value="${e.date}" min="2026-07-20" max="2026-12-20"></div>
      <div class="field" style="flex:1"><label>Tipo</label><select id="f_type">
        ${Object.entries(TYPES).map(([k,t]) => `<option value="${k}"${k===e.type?' selected':''}>${t.label}</option>`).join('')}
      </select></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>Início</label><input id="f_start" type="time" value="${e.start}"></div>
      <div class="field" style="flex:1"><label>Fim</label><input id="f_end" type="time" value="${e.end}"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>Presença</label><select id="f_status">
        ${Object.entries(ST).map(([k,s]) => `<option value="${k}"${k===stOf(e)?' selected':''}>${s.label}</option>`).join('')}
      </select></div>
      <div class="field" style="flex:1"><label>Observação</label><input id="f_note" value="${esc(e.note||'')}" placeholder="Preceptor, local, motivo da falta…"></div>
    </div>
    <div id="conflict" class="small" style="color:var(--prova);margin-bottom:10px"></div>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <div>${ev ? '<button class="btn danger" id="f_del">Excluir</button>' : ''}</div>
      <div class="row"><button class="btn" id="f_cancel">Cancelar</button><button class="btn primary" id="f_save">Salvar</button></div>
    </div>`;
  document.getElementById('modalWrap').classList.remove('hidden');

  const checkConflict = () => {
    const dt = document.getElementById('f_date').value;
    const s = toMin(document.getElementById('f_start').value), en = toMin(document.getElementById('f_end').value);
    const hits = evsOn(dt).filter(x => x.id !== e.id && toMin(x.start) < en && s < toMin(x.end));
    document.getElementById('conflict').textContent = hits.length
      ? 'Conflita com: ' + hits.map(h => h.title + ' (' + h.start + '–' + h.end + ')').join(', ')
      : '';
  };
  ['f_date','f_start','f_end'].forEach(id => document.getElementById(id).addEventListener('change', checkConflict));
  checkConflict();

  document.getElementById('f_cancel').onclick = closeModal;
  if (ev) document.getElementById('f_del').onclick = async () => {
    state.events = state.events.filter(x => x.id !== ev.id);
    await save(); closeModal(); render();
    Bus.emit('planner.event.deleted', {eventId:ev.id});
    toast('Atividade excluída');
  };
  document.getElementById('f_save').onclick = async () => {
    const o = {
      date: document.getElementById('f_date').value,
      start: document.getElementById('f_start').value,
      end: document.getElementById('f_end').value,
      type: document.getElementById('f_type').value,
      title: document.getElementById('f_title').value.trim() || 'Sem título',
      note: document.getElementById('f_note').value.trim()
    };
    if (toMin(o.end) <= toMin(o.start)){ toast('O fim precisa ser depois do início'); return; }
    const st = document.getElementById('f_status').value;
    if (ev){ Object.assign(ev, o); setStatus(ev, st); }
    else { const ne = {id:uid(), ...o, status:'pendente', done:false, custom:true}; setStatus(ne, st); state.events.push(ne); }
    await save(); closeModal(); render();
    Bus.emit(ev ? 'planner.event.updated' : 'planner.event.created', {eventId: ev ? ev.id : null});
    toast(ev ? 'Atividade atualizada' : 'Atividade adicionada');
  };
  document.getElementById('f_title').focus();
}
function closeModal(){ document.getElementById('modalWrap').classList.add('hidden'); }
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  Bus.emit('notification.created', {text:msg, channel:'toast'});
  toastT = setTimeout(() => { el.style.display = 'none'; }, 2200);
}

/* Atualização imediata: mexe só nos elementos daquela atividade.
   Nada de reconstruir a página inteira a cada clique. */
let rafId = 0;
function scheduleRender(){ cancelAnimationFrame(rafId); rafId = requestAnimationFrame(render); }

function applyStatus(id, st){
  const e = state.events.find(x => x.id === id);
  if (!e) return;
  setStatus(e, st);
  save();
  Bus.emit('planner.attendance.recorded', {eventId:e.id, status:st});

  const s = stOf(e), meta = ST[s], t = TYPES[e.type] || TYPES.PESSOAL;

  document.querySelectorAll('[data-cycle="'+id+'"]').forEach(el => {
    el.className = 'chk st-'+s;
    el.textContent = meta.mark;
    el.title = meta.label + ' — clique para alternar';
  });
  document.querySelectorAll('.ev[data-ev="'+id+'"]').forEach(el => {
    el.classList.toggle('is-marked', s !== 'pendente');
    const m = el.querySelector('.meta');
    if (m) m.innerHTML = t.label
      + (s !== 'pendente' ? ' · <b style="color:'+meta.c+'">'+meta.label+'</b>' : '')
      + (e.note ? ' · '+esc(e.note) : '')
      + (e.custom ? ' · adicionado por você' : '');
  });
  document.querySelectorAll('[data-set^="'+id+'|"]').forEach(b => {
    if (b.classList.contains('actbtn'))
      b.classList.toggle('on', b.dataset.set.split('|')[1] === s && s !== 'pendente');
    const card = b.closest('.ci');
    if (card){
      const tag = card.querySelector('.tag');
      if (tag){ tag.textContent = meta.label; tag.style.color = meta.c; }
    }
  });
  const prow = document.querySelector('.pendrow[data-pid="'+id+'"]');
  if (prow && s !== 'pendente') prow.remove();

  refreshCounters();
}

function refreshCounters(){
  if (view === 'checkin'){
    const acad = evsOn(ciDate).filter(isAcad);
    const s = stats(acad), g = stats(state.events.filter(isAcad)), np = pendingBefore(TODAY).length;
    const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
    set('ciReg', s.registrados+'/'+acad.length);
    set('ciPct', g.pct === null ? '—' : g.pct+'%');
    set('ciPend', np);
    const bar = document.querySelector('#ciBar > i');
    if (bar) bar.style.width = (acad.length ? s.registrados/acad.length*100 : 0)+'%';
    const pctEl = document.getElementById('ciPct');
    if (pctEl) pctEl.style.color = pctColor(g.pct);
    const pendEl = document.getElementById('ciPend');
    if (pendEl) pendEl.style.color = np ? 'var(--prova)' : 'var(--ink)';
  } else if (view === 'overview' || view === 'charts'){
    scheduleRender();
  }
}

function render(){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active',
    b.dataset.view === view || (b.dataset.view === 'workspaces' && view === 'ws')));
  const main = document.getElementById('main');
  main.innerHTML = R[view]();
  main.scrollTop = 0;

  if (view === 'workspaces' || view === 'ws') wsAfterRender();
  Router.sync();

  const q = document.getElementById('q');
  if (q){
    q.focus(); q.setSelectionRange(q.value.length, q.value.length);
    let qt;
    q.oninput = () => {
      searchQ = q.value;
      clearTimeout(qt);
      qt = setTimeout(() => {
        const p = q.selectionStart;
        render();
        const n = document.getElementById('q');
        if (n) n.setSelectionRange(p, p);
      }, 130);
    };
  }

  const ciPick = document.getElementById('ciPick');
  if (ciPick) ciPick.onchange = () => { if (ciPick.value){ ciDate = ciPick.value; render(); } };

  const allP = document.getElementById('allPresent');
  if (allP) allP.onclick = async () => {
    evsOn(ciDate).forEach(e => setStatus(e, 'presente'));
    await save(); render(); toast('Dia registrado como presente');
  };

  const wn = document.getElementById('weeknote');
  if (wn) wn.onchange = async () => { state.notes[weekSel] = wn.value; await save(); toast('Anotação salva'); };

  const gg = document.getElementById('goalGym'), gs = document.getElementById('goalStudy');
  if (gg) gg.onchange = async () => { state.goals.gym = +gg.value || 0; await save(); render(); };
  if (gs) gs.onchange = async () => { state.goals.study = +gs.value || 0; await save(); render(); };

  const ap = document.getElementById('applyAll');
  if (ap) ap.onclick = async () => {
    let n = 0;
    weekDays(weekSel).forEach(dt => suggestDay(dt).forEach(o => {
      state.events.push({id:uid(), date:dt, start:toHHMM(o.s), end:toHHMM(o.e), type:o.kind,
        title: o.kind === 'ACADEMIA' ? 'Academia' : o.kind === 'ESTUDO' ? 'Bloco de estudo' : 'Descanso',
        note:'sugestão automática', done:false, custom:true});
      n++;
    }));
    await save(); render(); toast(n + ' blocos adicionados à ' + weekSel);
  };

  const eb = document.getElementById('exportBtn');
  if (eb) eb.onclick = () => {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'planner_aluno026.json'; a.click();
    toast('Backup exportado');
  };
  const ib = document.getElementById('importBtn'), inf = document.getElementById('importFile');
  if (ib) ib.onclick = () => inf.click();
  if (inf) inf.onchange = async () => {
    const f = inf.files[0]; if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      if (!parsed.events) throw 0;
      state = {notes:{}, goals:{gym:4,study:10}, ...parsed};
      await save(); render(); toast('Backup importado');
    } catch(e){ toast('Arquivo inválido — use um backup exportado aqui'); }
  };
  const ro = document.getElementById('reonb');
  if (ro) ro.onclick = () => { onb.step = 'files'; onb.err = ''; onb.busy = false; showOnb(); };

  const rb = document.getElementById('resetBtn');  if (rb) rb.onclick = async () => {
    if (!confirm('Isto apaga suas edições e blocos pessoais, voltando à agenda original importada. Continuar?')) return;
    const base = state.baseline, wks = state.weeks;
    state = seedState();
    if (base && base.length){
      state.baseline = base; state.weeks = wks;
      state.events = base.map(r => ({id:uid(), date:r[0], start:r[1], end:r[2], type:r[3], title:r[4], note:'', status:'pendente', done:false, custom:false}));
    }
    invalidate(); await save(); render(); toast('Agenda original restaurada');
  };
}

/* ---------- APPLICATION: ações do domínio Planner ---------- */
Actions
  .register('app.navigate', ({value}) => { view = value; render(); })
  .register('planner.week.select', ({value}) => { weekSel = value; render(); })

    else searchTypes.has(value) ? searchTypes.delete(value) : searchTypes.add(value);

  })
  .register('planner.attendance.cycle', ({value}) => {

    if (e) applyStatus(e.id, CYCLE[(CYCLE.indexOf(stOf(e))+1) % CYCLE.length]);
  })

/* ---------- APPLICATION: rotas ---------- */
function routePath(){
  if (view === 'ws' && wsSel)  return '/workspace/' + wsSel + '/' + wsTab;
  if (view === 'workspaces')   return '/workspaces';
  if (view === 'weeks')        return '/planner/weeks/' + weekSel;
  if (view === 'checkin')      return '/planner/checkin/' + ciDate;
  return '/planner/' + view;
}
function routeApply(path){
  const p = path.replace(/^\//,'').split('/');
  if (p[0] === 'workspaces'){ view = 'workspaces'; return true; }
  if (p[0] === 'workspace' && p[1]){
    if (!wsStore || !wsStore.workspaces.some(w => w.id === p[1])) return false;
    wsSel = p[1]; wsTab = p[2] || 'overview'; view = 'ws'; return true;
  }
  if (p[0] === 'planner' && p[1]){
    if (!R[p[1]]) return false;
    view = p[1];
    if (p[1] === 'weeks' && p[2] && WEEKS.some(w => w.id === p[2])) weekSel = p[2];
    if (p[1] === 'checkin' && p[2] && /^\d{4}-\d{2}-\d{2}$/.test(p[2])) ciDate = p[2];
    return true;
  }
  return false;
}
Router.configure(routePath, routeApply);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); view = 'search'; render(); }
});

/* ============================================================
   9. PARTICIPANTES — domínios User · Membership · Invite
   ------------------------------------------------------------
   Modelo oficial (Épico 2):
     User        representa uma PESSOA (perfil), namespace 'users'
     Membership  representa a RELAÇÃO usuário↔workspace, namespace 'memberships'
     Invite      representa um CÓDIGO de entrada, namespace 'invites'

   Nada de cargo, responsabilidade, permissão ou status dentro de User.
   Um mesmo usuário participa de N workspaces com N Memberships distintas.
   ============================================================ */

/* ---------- 9.1 User — perfil da pessoa ---------- */
const Users = (() => {
  let ns;
  const blankUser = (id) => ({id, displayName:'', avatarUrl:null, course:'', institution:'', createdAt:nowISO(), updatedAt:nowISO()});
  return {
    async init(){ ns = Store.namespace('users', {schemaVersion:1}); await ns.load(() => ({byId:{}})); return ns.data; },
    upsert(patch){
      if (!patch || !patch.id || !ns) return null;   // ainda não inicializado: ignora silenciosamente
      const cur = ns.data.byId[patch.id] || blankUser(patch.id);
      const next = {...cur, ...patch, id: patch.id, updatedAt: nowISO()};
      ns.data.byId[patch.id] = next;
      ns.touch();
      Bus.emit('user.upserted', {userId: patch.id});
      return next;
    },
    get(id){ return ns.data.byId[id] || null; },
    /* contrato público: qualquer domínio pede um UserRef, nunca o registro inteiro */
    ref(id){
      const u = ns.data.byId[id];
      return u ? {id:u.id, displayName:u.displayName || 'Aluno', avatarUrl:u.avatarUrl || null}
                : {id, displayName:'Usuário', avatarUrl:null};
    },
    all(){ return Object.values(ns.data.byId); }
  };
})();

/* ---------- 9.2 Membership — relação usuário↔workspace ---------- */
const ROLES = ['owner','admin','editor','member','viewer'];
const ROLE_LABEL = {owner:'Proprietário', admin:'Administrador', editor:'Editor', member:'Membro', viewer:'Visualizador'};
/* Estrutura preparada para os cinco papéis. Hoje quase todos se comportam
   igual — só o essencial é diferenciado — mas o contrato já existe por
   inteiro para o dia em que precisar de mais granularidade. */
const ROLE_PERMISSIONS = {
  owner:  {manageWorkspace:true,  manageMembers:true,  manageInvites:true,  manageTasks:true, manageEvents:true, manageAssets:true, comment:true, view:true, deleteWorkspace:true},
  admin:  {manageWorkspace:true,  manageMembers:true,  manageInvites:true,  manageTasks:true, manageEvents:true, manageAssets:true, comment:true, view:true, deleteWorkspace:false},
  editor: {manageWorkspace:false, manageMembers:false, manageInvites:false, manageTasks:true, manageEvents:true, manageAssets:true, comment:true, view:true, deleteWorkspace:false},
  member: {manageWorkspace:false, manageMembers:false, manageInvites:false, manageTasks:true, manageEvents:true, manageAssets:true, comment:true, view:true, deleteWorkspace:false},
  viewer: {manageWorkspace:false, manageMembers:false, manageInvites:false, manageTasks:false, manageEvents:false, manageAssets:false, comment:true, view:true, deleteWorkspace:false}
};
const permissionsFor = role => ({...(ROLE_PERMISSIONS[role] || ROLE_PERMISSIONS.member)});

const Memberships = (() => {
  let ns;
  return {
    async init(){ ns = Store.namespace('memberships', {schemaVersion:1}); await ns.load(() => ({items:[]})); return ns.data; },
    all(){ return ns.data.items; },
    forWorkspace(wid){ return ns.data.items.filter(m => m.workspaceId === wid && m.status === 'active'); },
    of(wid, uid){ return ns.data.items.find(m => m.workspaceId === wid && m.userId === uid && m.status === 'active') || null; },
    isMember(wid, uid){ return !!Memberships.of(wid, uid); },
    workspacesOf(uid){ return ns.data.items.filter(m => m.userId === uid && m.status === 'active').map(m => m.workspaceId); },
    add({workspaceId, userId, role = 'member', responsibility = ''}){
      const existing = Memberships.of(workspaceId, userId);
      if (existing) return existing;                           // impede entrada duplicada
      const rec = {id:uid(), workspaceId, userId, role, responsibility, joinedAt:nowISO(), status:'active', permissions:permissionsFor(role)};
      ns.data.items.push(rec); ns.touch();
      Bus.emit('workspace.member.added', {workspaceId, membershipId:rec.id, userId});
      return rec;
    },
    setRole(id, role){
      const m = ns.data.items.find(x => x.id === id); if (!m) return null;
      m.role = role; m.permissions = permissionsFor(role); ns.touch();
      Bus.emit('workspace.member.updated', {workspaceId:m.workspaceId, membershipId:id, field:'role', value:role});
      return m;
    },
    setResponsibility(id, text){
      const m = ns.data.items.find(x => x.id === id); if (!m) return null;
      m.responsibility = text; ns.touch();
      Bus.emit('workspace.member.updated', {workspaceId:m.workspaceId, membershipId:id, field:'responsibility'});
      return m;
    },
    remove(id){
      const m = ns.data.items.find(x => x.id === id); if (!m) return false;
      m.status = 'removed'; ns.touch();
      Bus.emit('workspace.member.removed', {workspaceId:m.workspaceId, membershipId:id, userId:m.userId});
      return true;
    },
    countActive(wid){ return Memberships.forWorkspace(wid).length; }
  };
})();

/* ---------- 9.3 Invite — código de entrada ---------- */
const genInviteCode = () => 'ESTUDY-' + Math.random().toString(36).slice(2,6).toUpperCase();
const Invites = (() => {
  let ns;
  return {
    async init(){ ns = Store.namespace('invites', {schemaVersion:1}); await ns.load(() => ({items:[]})); return ns.data; },
    create({workspaceId, createdBy, maxUses = null, expiresAt = null, code = null}){
      const rec = {id:uid(), workspaceId, code: code || genInviteCode(), createdBy, createdAt:nowISO(),
        expiresAt, maxUses, currentUses:0, status:'active'};
      ns.data.items.push(rec); ns.touch();
      Bus.emit('workspace.invite.created', {workspaceId, inviteId:rec.id});
      return rec;
    },
    forWorkspace(wid){ return ns.data.items.filter(i => i.workspaceId === wid); },
    primary(wid){ return Invites.forWorkspace(wid).find(i => i.status === 'active') || null; },
    findByCode(code){ return ns.data.items.find(i => i.code.toUpperCase() === String(code || '').toUpperCase()); },
    /* checagens preparadas: expiração e limite de usos, mesmo que hoje nasçam ilimitados */
    validate(code){
      const inv = Invites.findByCode(code);
      if (!inv) return {ok:false, reason:'not_found'};
      if (inv.status === 'exhausted') return {ok:false, reason:'exhausted', invite:inv};
      if (inv.status === 'revoked')   return {ok:false, reason:'inactive', invite:inv};
      if (inv.status !== 'active')    return {ok:false, reason:'inactive', invite:inv};
      if (inv.expiresAt && inv.expiresAt < nowISO()) return {ok:false, reason:'expired', invite:inv};
      if (inv.maxUses != null && inv.currentUses >= inv.maxUses) return {ok:false, reason:'exhausted', invite:inv};
      return {ok:true, invite:inv};
    },
    redeem(code){
      const v = Invites.validate(code);
      if (!v.ok) return v;
      v.invite.currentUses++;
      if (v.invite.maxUses != null && v.invite.currentUses >= v.invite.maxUses) v.invite.status = 'exhausted';
      ns.touch();
      Bus.emit('workspace.invite.redeemed', {workspaceId:v.invite.workspaceId, inviteId:v.invite.id});
      return v;
    },
    revoke(id){
      const i = ns.data.items.find(x => x.id === id); if (!i) return false;
      i.status = 'revoked'; ns.touch();
      Bus.emit('workspace.invite.revoked', {workspaceId:i.workspaceId, inviteId:id});
      return true;
    }
  };
})();

/* ============================================================
   9.4 WORKSPACE — ambiente colaborativo (módulo isolado)
   ------------------------------------------------------------
   Store, chave de gravação e domínio próprios. Não toca em
   `state`, `idx()` nem `weekOf()` — o planner continua pessoal.
   Toda mutação passa por wsTouch() + wsSave(), deixando cada
   registro marcado para a sincronização futura (wsSync).
   ============================================================ */
let wsStore = null;
